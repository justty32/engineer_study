<svg id="emmagnet-cross-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 565" role="img" aria-labelledby="emmagnet-cross-title emmagnet-cross-desc"><title id="emmagnet-cross-title">三方向分開看</title><desc id="emmagnet-cross-desc">正電荷：右向速度叉入紙磁場，力向上。箭頭皆為方向示意，不能跨單位比較長度。</desc><defs><marker id="emmagnet-cross-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emmagnet-cross-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emmagnet-cross-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emmagnet-cross-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emmagnet-cross-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="565" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">右手座標：x 右、y 上、z 出紙</text><line x1="160" y1="300" x2="510" y2="300" class="axis"/><line x1="160" y1="300" x2="160" y2="90" class="axis"/><text x="515" y="330" class="" text-anchor="start">+x</text><text x="120" y="80" class="" text-anchor="start">+y</text><line x1="160" y1="300" x2="420" y2="300" class="mint" marker-end="url(#emmagnet-cross-mint-arrow)"/><line x1="160" y1="300" x2="160" y2="125" class="amber" marker-end="url(#emmagnet-cross-amber-arrow)"/><circle cx="160" cy="300" r="12" class="blue"/><line x1="153" y1="293" x2="167" y2="307" class="blue"/><line x1="153" y1="307" x2="167" y2="293" class="blue"/><text x="320" y="275" class="mint-fill" text-anchor="start">v：+x</text><text x="185" y="150" class="amber-fill" text-anchor="start">F：+y</text><text x="230" y="370" class="blue-fill" text-anchor="start">B：−z，入紙</text><text x="30" y="425" class="" text-anchor="start">q = +1 nC；v = 1000 m/s</text><text x="30" y="470" class="" text-anchor="start">B = .20 T；F = .20 μN</text><text x="30" y="520" class="" text-anchor="start">負 q：力改向下；場與速度不變</text></svg>
