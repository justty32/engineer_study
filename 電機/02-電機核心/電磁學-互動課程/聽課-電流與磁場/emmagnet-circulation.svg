<svg id="emmagnet-circulation-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" role="img" aria-labelledby="emmagnet-circulation-title emmagnet-circulation-desc"><title id="emmagnet-circulation-title">每段投影乘上弧長</title><desc id="emmagnet-circulation-desc">所有綠箭頭同時代表 B 與正走向 dℓ 的方向。等弧貢獻精確四等分，並非四個測點的大小直接相加。</desc><defs><marker id="emmagnet-circulation-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emmagnet-circulation-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emmagnet-circulation-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emmagnet-circulation-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emmagnet-circulation-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="820" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">虛線：安培路徑；非通電金屬</text><circle cx="300" cy="270" r="150" class="axis dash"/><circle cx="300" cy="270" r="12" class="amber"/><circle cx="300" cy="270" r="5" fill="#ffc67b"/><line x1="450" y1="270" x2="450" y2="185" class="mint" marker-end="url(#emmagnet-circulation-mint-arrow)"/><line x1="300" y1="120" x2="215" y2="120" class="mint" marker-end="url(#emmagnet-circulation-mint-arrow)"/><line x1="150" y1="270" x2="150" y2="355" class="mint" marker-end="url(#emmagnet-circulation-mint-arrow)"/><line x1="300" y1="420" x2="385" y2="420" class="mint" marker-end="url(#emmagnet-circulation-mint-arrow)"/><text x="30" y="490" class="" text-anchor="start">逆時針路徑 ↔ 出紙正法向</text><text x="30" y="535" class="" text-anchor="start">四處 B = 100 μT，皆沿切線</text><text x="30" y="580" class="" text-anchor="start">r = .02 m；周長 .125664 m</text><text x="30" y="635" class="" text-anchor="start">每個四分之一圓弧：</text><text x="30" y="680" class="" text-anchor="start">100 × (.125664/4)</text><text x="30" y="725" class="" text-anchor="start">= 3.141593 μT·m</text><text x="30" y="780" class="" text-anchor="start">整圈：12.566371 μT·m</text></svg>
