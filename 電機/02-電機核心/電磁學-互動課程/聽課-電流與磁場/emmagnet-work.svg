<svg id="emmagnet-work-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 960" role="img" aria-labelledby="emmagnet-work-title emmagnet-work-desc"><title id="emmagnet-work-title">垂直受力與完整回路</title><desc id="emmagnet-work-desc">上方均勻場入紙，正電荷逆時針等速轉彎；下方只讓水平有效段處於顯著磁場。圖形不按尺度。</desc><defs><marker id="emmagnet-work-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emmagnet-work-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emmagnet-work-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emmagnet-work-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emmagnet-work-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="960" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">單粒子：只改方向，不增加動能</text><circle cx="300" cy="210" r="100" class="blue"/><circle cx="90" cy="130" r="12" class="blue"/><line x1="83" y1="123" x2="97" y2="137" class="blue"/><line x1="83" y1="137" x2="97" y2="123" class="blue"/><circle cx="90" cy="290" r="12" class="blue"/><line x1="83" y1="283" x2="97" y2="297" class="blue"/><line x1="83" y1="297" x2="97" y2="283" class="blue"/><circle cx="510" cy="130" r="12" class="blue"/><line x1="503" y1="123" x2="517" y2="137" class="blue"/><line x1="503" y1="137" x2="517" y2="123" class="blue"/><circle cx="510" cy="290" r="12" class="blue"/><line x1="503" y1="283" x2="517" y2="297" class="blue"/><line x1="503" y1="297" x2="517" y2="283" class="blue"/><circle cx="300" cy="310" r="5" fill="#ffc67b"/><line x1="300" y1="310" x2="375" y2="310" class="mint" marker-end="url(#emmagnet-work-mint-arrow)"/><line x1="300" y1="310" x2="300" y2="245" class="amber" marker-end="url(#emmagnet-work-amber-arrow)"/><circle cx="400" cy="210" r="5" fill="#ffc67b"/><line x1="400" y1="210" x2="400" y2="135" class="mint" marker-end="url(#emmagnet-work-mint-arrow)"/><line x1="400" y1="210" x2="335" y2="210" class="amber" marker-end="url(#emmagnet-work-amber-arrow)"/><circle cx="300" cy="110" r="5" fill="#ffc67b"/><line x1="300" y1="110" x2="225" y2="110" class="mint" marker-end="url(#emmagnet-work-mint-arrow)"/><line x1="300" y1="110" x2="300" y2="175" class="amber" marker-end="url(#emmagnet-work-amber-arrow)"/><text x="30" y="380" class="" text-anchor="start">綠 v 切向；橘 F 朝心；逆時針</text><text x="30" y="425" class="" text-anchor="start">F · v = 0；未指定質量與半徑</text><line x1="30" y1="455" x2="570" y2="455" class="axis"/><text x="30" y="500" class="" text-anchor="start">導線：回路完整，電源提供能量</text><rect x="145" y="555" width="310" height="115" rx="10" fill="#8db8ff18"/><circle cx="180" cy="645" r="12" class="blue"/><line x1="173" y1="638" x2="187" y2="652" class="blue"/><line x1="173" y1="652" x2="187" y2="638" class="blue"/><circle cx="280" cy="645" r="12" class="blue"/><line x1="273" y1="638" x2="287" y2="652" class="blue"/><line x1="273" y1="652" x2="287" y2="638" class="blue"/><circle cx="380" cy="645" r="12" class="blue"/><line x1="373" y1="638" x2="387" y2="652" class="blue"/><line x1="373" y1="652" x2="387" y2="638" class="blue"/><path d="M100 760 V595 H500 V760 H350" class="axis"/><line x1="100" y1="760" x2="250" y2="760" class="axis"/><line x1="280" y1="730" x2="280" y2="790" class="pink"/><line x1="310" y1="740" x2="310" y2="780" class="pink"/><line x1="250" y1="760" x2="280" y2="760" class="axis"/><line x1="310" y1="760" x2="350" y2="760" class="axis"/><line x1="180" y1="595" x2="420" y2="595" class="mint" marker-end="url(#emmagnet-work-mint-arrow)"/><line x1="300" y1="595" x2="300" y2="530" class="amber" marker-end="url(#emmagnet-work-amber-arrow)"/><text x="325" y="550" class="" text-anchor="start">F 向上</text><text x="165" y="705" class="" text-anchor="start">有效段 ℓ = .10 m</text><text x="190" y="825" class="" text-anchor="start">電源；回流位在場外</text><text x="30" y="875" class="" text-anchor="start">I = 2 A；B = .20 T；F = .04 N</text><text x="30" y="920" class="" text-anchor="start">霍爾探棒量 B；力感測器量 F</text></svg>
