<svg id="emmagnet-angle-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="emmagnet-angle-title emmagnet-angle-desc"><title id="emmagnet-angle-title">垂直分量決定磁力</title><desc id="emmagnet-angle-desc">磁場改為向右；正電荷速度在紙面逆時針旋轉。0 到 180 度間力入紙，兩端為零；箭頭方向示意。</desc><defs><marker id="emmagnet-angle-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emmagnet-angle-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emmagnet-angle-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emmagnet-angle-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emmagnet-angle-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="600" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">本圖改設：B 沿 +x，v 在 xy 面</text><line x1="120" y1="300" x2="520" y2="300" class="axis"/><line x1="300" y1="350" x2="300" y2="80" class="axis"/><line x1="300" y1="300" x2="480" y2="300" class="blue" marker-end="url(#emmagnet-angle-blue-arrow)"/><text x="450" y="340" class="blue-fill" text-anchor="start">B +x</text><line id="emmagnet-v-par" x1="300" y1="300" x2="300" y2="300" class="amber dash"/><line id="emmagnet-v-perp" x1="300" y1="300" x2="300" y2="140" class="pink dash"/><line id="emmagnet-v-arrow" x1="300" y1="300" x2="300" y2="140" class="mint" marker-end="url(#emmagnet-angle-mint-arrow)"/><text x="30" y="410" class="" text-anchor="start">綠：速度；橘：平行分量</text><text x="30" y="455" class="" text-anchor="start">粉：垂直分量（才產生磁力）</text><text id="emmagnet-angle-reading" x="30" y="510">θ = 90°；|F| = .200 μN</text><text id="emmagnet-angle-direction" x="30" y="555">F 沿 −z，入紙</text></svg>
