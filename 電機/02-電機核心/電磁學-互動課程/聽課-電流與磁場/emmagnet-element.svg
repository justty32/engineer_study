<svg id="emmagnet-element-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="emmagnet-element-title emmagnet-element-desc"><title id="emmagnet-element-title">來源指向觀測點</title><desc id="emmagnet-element-desc">dℓ 出紙，R 往右，該微段的 dB 向上。箭頭方向示意；圖中未把單段當成長線總場。</desc><defs><marker id="emmagnet-element-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emmagnet-element-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emmagnet-element-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emmagnet-element-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emmagnet-element-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="560" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">xy 視圖：來源微段沿 +z 出紙</text><line x1="130" y1="300" x2="500" y2="300" class="axis"/><line x1="130" y1="300" x2="130" y2="95" class="axis"/><circle cx="130" cy="300" r="12" class="mint"/><circle cx="130" cy="300" r="5" fill="#78e2ca"/><circle cx="420" cy="300" r="5" fill="#ffc67b"/><line x1="155" y1="300" x2="390" y2="300" class="amber" marker-end="url(#emmagnet-element-amber-arrow)"/><line x1="420" y1="300" x2="420" y2="135" class="blue" marker-end="url(#emmagnet-element-blue-arrow)"/><text x="60" y="355" class="" text-anchor="start">來源 dℓ</text><text x="400" y="355" class="" text-anchor="start">觀測 P</text><text x="240" y="275" class="amber-fill" text-anchor="start">R →</text><text x="445" y="165" class="blue-fill" text-anchor="start">dB</text><text x="30" y="420" class="" text-anchor="start">dℓ × R̂ = (+z) × (+x) = +y</text><text x="30" y="470" class="" text-anchor="start">R 從來源指向 P；不能倒轉</text><text x="30" y="520" class="" text-anchor="start">這只是一段；整條線還要向量相加</text></svg>
