<svg id="emline-phase-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 775" role="img" aria-labelledby="emline-phase-title emline-phase-desc"><title id="emline-phase-title">量測面向源端，反射比轉兩倍角</title><desc id="emline-phase-desc">d ≥ 0 向源端，位置 z = −d；ΓL=1/3。圓半徑固定 1/3，兩軸使用共同尺度。不是完整史密斯圖。</desc><defs><marker id="emline-phase-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emline-phase-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emline-phase-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emline-phase-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emline-phase-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="775" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">反射比平面：Re／Im 同尺度</text><line x1="100" y1="270" x2="530" y2="270" class="axis"/><line x1="300" y1="470" x2="300" y2="65" class="axis"/><circle cx="300" cy="270" r="140" class="blue"/><path d="M440 270 A140 140 0 0 1 300 410" class="mint" marker-end="url(#emline-phase-mint-arrow)"/><path d="M300 410 A140 140 0 0 1 160 270" class="mint" marker-end="url(#emline-phase-mint-arrow)"/><text x="530" y="310" class="" text-anchor="end">Re</text><text x="325" y="80" class="" text-anchor="start">Im</text><circle cx="440" cy="270" r="5" fill="#ffc67b"/><circle cx="300" cy="410" r="5" fill="#ffc67b"/><circle cx="160" cy="270" r="5" fill="#ffc67b"/><text x="450" y="245" class="" text-anchor="start">+1/3</text><text x="85" y="245" class="" text-anchor="start">−1/3</text><text x="320" y="440" class="" text-anchor="start">−j/3</text><text x="30" y="525" class="" text-anchor="start">d = 0 → +1/3</text><text x="30" y="575" class="" text-anchor="start">d = λ/8 → −j/3（下方）</text><text x="30" y="625" class="" text-anchor="start">d = λ/4 → −1/3（左側）</text><text x="30" y="675" class="" text-anchor="start">d = λ/2 → +1/3（回到右側）</text><text x="30" y="730" class="" text-anchor="start">Γin = ΓL e^(−j2βd)，順時針</text></svg>
