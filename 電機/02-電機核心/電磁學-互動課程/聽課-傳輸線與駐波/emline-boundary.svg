<svg id="emline-boundary-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880" role="img" aria-labelledby="emline-boundary-title emline-boundary-desc"><title id="emline-boundary-title">反射電流負號要保留</title><desc id="emline-boundary-desc">峰值相量：入射向 +z、反射向 −z；電流參考始終 +z。負載接回下導體，功率條長度共用比例。</desc><defs><marker id="emline-boundary-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emline-boundary-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emline-boundary-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emline-boundary-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emline-boundary-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="880" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">負載 z = 0；線在 z ≤ 0</text><line x1="80" y1="180" x2="500" y2="180" class="axis"/><line x1="80" y1="330" x2="500" y2="330" class="blue"/><line x1="500" y1="180" x2="500" y2="215" class="axis"/><rect x="480" y="215" width="40" height="65" class="amber"/><line x1="500" y1="280" x2="500" y2="330" class="axis"/><line x1="80" y1="180" x2="80" y2="330" class="axis dash"/><line x1="130" y1="120" x2="390" y2="120" class="mint" marker-end="url(#emline-boundary-mint-arrow)"/><line x1="390" y1="270" x2="130" y2="270" class="pink" marker-end="url(#emline-boundary-pink-arrow)"/><text x="130" y="90" class="" text-anchor="start">V⁺ = 3 V；I⁺ = +.060 A</text><text x="120" y="235" class="" text-anchor="start">V⁻ = 1 V；I⁻ = −.020 A</text><text x="320" y="390" class="" text-anchor="start">負載 RL = 100 Ω</text><text x="30" y="445" class="" text-anchor="start">VL = 4 V；IL = .040 A → +z</text><text x="30" y="500" class="" text-anchor="start">箭頭：波傳播方向；I 參考固定 +z</text><text x="30" y="585" class="" text-anchor="start">入射 →</text><rect x="160" y="560" width="300.0" height="30" fill="#78e2ca"/><text x="470" y="585" class="" text-anchor="start">90 mW</text><text x="30" y="665" class="" text-anchor="start">反射 ←</text><rect x="160" y="640" width="33.333333333333336" height="30" fill="#ef9dbb"/><text x="470" y="665" class="" text-anchor="start">10 mW</text><text x="30" y="745" class="" text-anchor="start">負載</text><rect x="160" y="720" width="266.6666666666667" height="30" fill="#ffc67b"/><text x="470" y="745" class="" text-anchor="start">80 mW</text><text x="30" y="840" class="" text-anchor="start">9 : 1 : 8 功率條，同一尺度</text></svg>
