<svg id="emline-cell-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 685" role="img" aria-labelledby="emline-cell-title emline-cell-desc"><title id="emline-cell-title">每米參數乘小段長度</title><desc id="emline-cell-desc">上導體向右為電流正向，下導體回流；電容跨兩導體。這是連續場儲能的等效切片，不是電纜內藏離散元件。</desc><defs><marker id="emline-cell-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emline-cell-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emline-cell-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emline-cell-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emline-cell-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="685" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">Δz = .10 m；分佈場的等效小段</text><line x1="80" y1="170" x2="235" y2="170" class="mint"/><line x1="305" y1="170" x2="520" y2="170" class="mint"/><rect x="235" y="150" width="70" height="40" class="amber"/><line x1="80" y1="360" x2="520" y2="360" class="blue"/><path d="M80 170 V360" class="axis dash"/><path d="M520 170 V360" class="axis dash"/><line x1="380" y1="170" x2="380" y2="245" class="amber"/><line x1="350" y1="245" x2="410" y2="245" class="amber"/><line x1="350" y1="270" x2="410" y2="270" class="amber"/><line x1="380" y1="270" x2="380" y2="360" class="amber"/><line x1="110" y1="170" x2="185" y2="170" class="mint" marker-end="url(#emline-cell-mint-arrow)"/><line x1="430" y1="170" x2="500" y2="170" class="mint" marker-end="url(#emline-cell-mint-arrow)"/><line x1="440" y1="360" x2="130" y2="360" class="blue" marker-end="url(#emline-cell-blue-arrow)"/><text x="100" y="115" class="" text-anchor="start">i(z) →</text><text x="390" y="115" class="" text-anchor="start">i(z+Δz) →</text><text x="215" y="220" class="" text-anchor="start">L = 25 nH</text><text x="420" y="270" class="" text-anchor="start">C</text><text x="420" y="310" class="" text-anchor="start">10 pF</text><text x="100" y="260" class="" text-anchor="start">+ v(z)</text><text x="100" y="310" class="" text-anchor="start">−</text><text x="30" y="420" class="" text-anchor="start">上對下定義電壓；下導體完整回流</text><text x="30" y="475" class="" text-anchor="start">右端電壓：v(z + Δz)，同極性</text><text x="30" y="530" class="" text-anchor="start">L′ = 250 nH/m；C′ = 100 pF/m</text><text x="30" y="585" class="" text-anchor="start">R′ = 0；G′ = 0（無損近似）</text><text x="30" y="640" class="" text-anchor="start">虛線連至其餘回路；不是未知接地</text></svg>
