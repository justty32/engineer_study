<svg id="emline-limits-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980" role="img" aria-labelledby="emline-limits-title emline-limits-desc"><title id="emline-limits-title">開短、匹配，各有不同邊界</title><desc id="emline-limits-desc">三卡同為理想無損線、固定入射峰值。開短的無限是阻抗極限，不以大有限電阻替代，也未模擬暫態。</desc><defs><marker id="emline-limits-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emline-limits-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emline-limits-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emline-limits-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emline-limits-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.dash{stroke-dasharray:7 6}.muted-text{fill:#a8b7c6}.big-text{font-size:28px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="980" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">同一線：Z₀ = 50 Ω；V⁺ = 3 V peak</text><rect x="25" y="85" width="550" height="225" rx="15" class="mint"/><text x="45" y="130" class="mint-fill" text-anchor="start">匹配 RL = 50 Ω</text><text x="45" y="180" class="" text-anchor="start">Γ = 0；VSWR = 1</text><text x="45" y="225" class="" text-anchor="start">任意 d：Zin = 50 Ω</text><text x="45" y="270" class="" text-anchor="start">VL = 3 V；IL = .060 A；PL = .09 W</text><rect x="25" y="335" width="550" height="225" rx="15" class="blue"/><text x="45" y="380" class="blue-fill" text-anchor="start">短路 RL = 0 Ω</text><text x="45" y="430" class="" text-anchor="start">Γ = −1；VSWR = ∞</text><text x="45" y="475" class="" text-anchor="start">VL = 0；IL = .120 A；PL = 0</text><text x="45" y="520" class="" text-anchor="start">d = λ/4：等效開路，Zin → ∞</text><rect x="25" y="585" width="550" height="225" rx="15" class="amber"/><text x="45" y="630" class="amber-fill" text-anchor="start">理想開路 RL → ∞</text><text x="45" y="680" class="" text-anchor="start">Γ = +1；VSWR = ∞</text><text x="45" y="725" class="" text-anchor="start">VL = 6 V；IL = 0；PL = 0</text><text x="45" y="770" class="" text-anchor="start">d = λ/4：等效短路，Zin = 0</text><text x="30" y="885" class="" text-anchor="start">限理想正弦穩態；非暫態無窮電壓</text><text x="30" y="935" class="" text-anchor="start">VNA：頻率與校正參考面一起記錄</text></svg>
