<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 990" role="img" aria-labelledby="emwave-area-title emwave-area-desc"><title id="emwave-area-title">方向與面積都要算</title><desc id="emwave-area-desc">三個面片法向依次與能流夾零、六十、九十度。每個面片垂直其法向。穿面功率依次為約零點二六五四四、零點一三二七二與零瓦。</desc><defs><marker id="emwave-area-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emwave-area-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emwave-area-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emwave-area-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emwave-area-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ba0b3"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.small{font-size:21px}.big{font-size:27px;font-weight:650}.grid{stroke:#33465a;stroke-width:1}.axis{stroke:#8ba0b3;stroke-width:1.7}.dash{stroke-dasharray:7 6}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.axis{stroke:#8ba0b3;fill:none;stroke-width:3}</style><rect width="600" height="990" fill="#111f30"/><text x="25" y="35" class="small" text-anchor="start">截面方向示意：面片垂直自己的法向</text><line x1="50" y1="155" x2="530" y2="155" class="blue" marker-end="url(#emwave-area-blue-arrow)"/><text x="45" y="115" class="small" text-anchor="start">S → +z</text><line x1="300.0" y1="75.0" x2="300.0" y2="235.0" class="mint"/><line x1="300" y1="155" x2="420.0" y2="155.0" class="amber" marker-end="url(#emwave-area-amber-arrow)"/><text x="440" y="67" class="small" text-anchor="start">θ = 0°</text><text x="430" y="130" class="small" text-anchor="start">n̂</text><text x="35" y="265" class="small" text-anchor="start">P ≈ 0.2654419 W</text><line x1="50" y1="390" x2="530" y2="390" class="blue" marker-end="url(#emwave-area-blue-arrow)"/><text x="45" y="350" class="small" text-anchor="start">S → +z</text><line x1="230.71796769724492" y1="350.0" x2="369.28203230275506" y2="430.0" class="mint"/><line x1="300" y1="390" x2="360.0" y2="286.07695154586736" class="amber" marker-end="url(#emwave-area-amber-arrow)"/><text x="440" y="302" class="small" text-anchor="start">θ = 60°</text><text x="320" y="280" class="small" text-anchor="start">n̂</text><text x="35" y="500" class="small" text-anchor="start">P ≈ 0.1327209 W</text><line x1="50" y1="625" x2="530" y2="625" class="blue" marker-end="url(#emwave-area-blue-arrow)"/><text x="45" y="585" class="small" text-anchor="start">S → +z</text><line x1="220.0" y1="625.0" x2="380.0" y2="625.0" class="mint"/><line x1="300" y1="625" x2="300.0" y2="505.0" class="amber" marker-end="url(#emwave-area-amber-arrow)"/><text x="440" y="537" class="small" text-anchor="start">θ = 90°</text><text x="320" y="515" class="small" text-anchor="start">n̂</text><text x="35" y="735" class="small" text-anchor="start">P ≈ 0.0000000 W</text><text x="30" y="850" class="small" text-anchor="start">P = 平均 S × A cosθ；A = 0.02 m²</text><text x="30" y="900" class="small" text-anchor="start">平均 u ≈ 4.427094 × 10⁻⁸ J/m³</text><text x="30" y="945" class="small" text-anchor="start">c × 平均 u ≈ 13.272094 W/m²</text></svg>
