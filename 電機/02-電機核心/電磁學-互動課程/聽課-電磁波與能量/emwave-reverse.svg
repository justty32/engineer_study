<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 825" role="img" aria-labelledby="emwave-reverse-title emwave-reverse-desc"><title id="emwave-reverse-title">波往回走，磁場方向也要重算</title><desc id="emwave-reverse-desc">前波電場向上、磁場出紙、波向右。反波電場向上、磁場入紙、波向左。相加時磁場相減。</desc><defs><marker id="emwave-reverse-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emwave-reverse-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emwave-reverse-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emwave-reverse-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emwave-reverse-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ba0b3"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.small{font-size:21px}.big{font-size:27px;font-weight:650}.grid{stroke:#33465a;stroke-width:1}.axis{stroke:#8ba0b3;stroke-width:1.7}.dash{stroke-dasharray:7 6}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.axis{stroke:#8ba0b3;fill:none;stroke-width:3}</style><rect width="600" height="825" fill="#111f30"/><text x="30" y="55" class="big" text-anchor="start">前波 +z</text><line x1="260" y1="220" x2="260" y2="100" class="mint" marker-end="url(#emwave-reverse-mint-arrow)"/><text x="285" y="120" class="small" text-anchor="start">E 沿 +x</text><line x1="260" y1="220" x2="480" y2="220" class="amber" marker-end="url(#emwave-reverse-amber-arrow)"/><text x="330" y="262" class="small" text-anchor="start">波向 +z</text><circle cx="260" cy="220" r="19" class="blue"/><circle cx="260" cy="220" r="7" fill="#8db8ff"/><text x="35" y="313" class="small" text-anchor="start">H前 = +E前 / η₀；+y 出紙</text><text x="30" y="365" class="big" text-anchor="start">反波 −z</text><line x1="260" y1="530" x2="260" y2="410" class="mint" marker-end="url(#emwave-reverse-mint-arrow)"/><text x="285" y="430" class="small" text-anchor="start">E 沿 +x</text><line x1="260" y1="530" x2="40" y2="530" class="amber" marker-end="url(#emwave-reverse-amber-arrow)"/><text x="40" y="572" class="small" text-anchor="start">波向 −z</text><circle cx="260" cy="530" r="19" class="blue"/><line x1="248" y1="518" x2="272" y2="542" class="blue"/><line x1="248" y1="542" x2="272" y2="518" class="blue"/><text x="35" y="623" class="small" text-anchor="start">H反 = −E反 / η₀；−y 入紙</text><text x="30" y="690" class="big" text-anchor="start">總 E = E前 + E反</text><text x="30" y="735" class="big" text-anchor="start">總 H = (E前 − E反) / η₀</text><text x="30" y="785" class="small" text-anchor="start">總場比值未必是 η₀；箭頭為方向示意。</text></svg>
