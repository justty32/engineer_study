<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 810" role="img" aria-labelledby="emwave-triad-title emwave-triad-desc"><title id="emwave-triad-title">單一前進波的三方向</title><desc id="emwave-triad-desc">正波峰電場向上、磁場出紙，半週後電場向下、磁場入紙，兩組叉積均向右。</desc><defs><marker id="emwave-triad-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emwave-triad-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emwave-triad-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emwave-triad-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="emwave-triad-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ba0b3"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:24px}.small{font-size:21px}.big{font-size:27px;font-weight:650}.grid{stroke:#33465a;stroke-width:1}.axis{stroke:#8ba0b3;stroke-width:1.7}.dash{stroke-dasharray:7 6}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.axis{stroke:#8ba0b3;fill:none;stroke-width:3}</style><rect width="600" height="810" fill="#111f30"/><text x="30" y="42" class="small" text-anchor="start">右手座標：x 向上、y 出紙、z 向右</text><text x="35" y="95" class="big" text-anchor="start">正波峰</text><line x1="160" y1="245" x2="460" y2="245" class="axis" marker-end="url(#emwave-triad-axis-arrow)"/><text x="470" y="253" class="small" text-anchor="start">+z</text><line x1="160" y1="245" x2="160" y2="125" class="mint" marker-end="url(#emwave-triad-mint-arrow)"/><text x="190" y="150" class="small" text-anchor="start">E：+x</text><circle cx="160" cy="245" r="20" class="blue"/><circle cx="160" cy="245" r="7" fill="#8db8ff"/><text x="210" y="292" class="small" text-anchor="start">H：+y 出紙</text><line x1="330" y1="330" x2="470" y2="330" class="amber" marker-end="url(#emwave-triad-amber-arrow)"/><text x="310" y="370" class="small" text-anchor="start">E × H 沿 +z</text><text x="35" y="400" class="big" text-anchor="start">半週後</text><line x1="160" y1="550" x2="460" y2="550" class="axis" marker-end="url(#emwave-triad-axis-arrow)"/><text x="470" y="558" class="small" text-anchor="start">+z</text><line x1="160" y1="550" x2="160" y2="670" class="mint" marker-end="url(#emwave-triad-mint-arrow)"/><text x="190" y="645" class="small" text-anchor="start">E：−x</text><circle cx="160" cy="550" r="20" class="blue"/><line x1="148" y1="538" x2="172" y2="562" class="blue"/><line x1="148" y1="562" x2="172" y2="538" class="blue"/><text x="210" y="597" class="small" text-anchor="start">H：−y 入紙</text><line x1="330" y1="635" x2="470" y2="635" class="amber" marker-end="url(#emwave-triad-amber-arrow)"/><text x="310" y="675" class="small" text-anchor="start">E × H 沿 +z</text><text x="30" y="730" class="small" text-anchor="start">E₀ = 100 V/m；H₀ ≈ 0.265442 A/m</text><text x="30" y="770" class="small" text-anchor="start">B₀ ≈ 0.333564 μT；方向示意</text></svg>
