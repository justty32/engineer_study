<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" role="img" aria-labelledby="eminterface-solve-title eminterface-solve-desc"><title id="eminterface-solve-title">聯立求反射係數</title><desc id="eminterface-solve-desc">三步代數從總場邊界消去透射，解出反射電場比，再求透射電場比。</desc><defs><marker id="eminterface-solve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eef3f6"/></marker></defs><rect width="600" height="580" fill="#111f30"/><rect x="24" y="35" width="552" height="102" rx="12" fill="#17283b"/><text x="42" y="70" class="" text-anchor="start">① 把 Eₜ 換成 Eᵢ + Eᵣ</text><text x="42" y="110" class="" text-anchor="start">η₂(Eᵢ − Eᵣ) = η₁(Eᵢ + Eᵣ)</text><rect x="24" y="160" width="552" height="102" rx="12" fill="#17283b"/><text x="42" y="195" class="" text-anchor="start">② 收集反射項</text><text x="42" y="235" class="" text-anchor="start">(η₁ + η₂)Eᵣ = (η₂ − η₁)Eᵢ</text><rect x="24" y="285" width="552" height="142" rx="12" fill="#17283b"/><text x="42" y="320" class="" text-anchor="start">③ 除出比值（無單位）</text><text x="42" y="360" class="" text-anchor="start">Γ = Eᵣ/Eᵢ = (η₂ − η₁)/(η₂ + η₁)</text><text x="42" y="400" class="" text-anchor="start">τ = Eₜ/Eᵢ = 1 + Γ</text><rect x="24" y="455" width="552" height="102" rx="12" fill="#17283b"/><text x="42" y="490" class="" text-anchor="start">q = 0.5：Γ = −1/3；τ = 2/3</text><text x="42" y="530" class="" text-anchor="start">固定座標磁場反射比 Hᵣ/Hᵢ = −Γ</text></svg>
