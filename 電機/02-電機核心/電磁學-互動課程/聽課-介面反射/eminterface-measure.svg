<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 785" role="img" aria-labelledby="eminterface-measure-title eminterface-measure-desc"><title id="eminterface-measure-title">介面與傳輸線的對應</title><desc id="eminterface-measure-desc">並排材料波阻抗與線路特性阻抗，再列固定q等於二的守恆結果與量測限制。</desc><defs><marker id="eminterface-measure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eef3f6"/></marker></defs><rect width="600" height="785" fill="#111f30"/><text x="35" y="35" class="" text-anchor="start">材料介面</text><text x="330" y="35" class="" text-anchor="start">傳輸線負載</text><line  x1="300" y1="65" x2="300" y2="340" stroke="#71889b" stroke-width="3" /><text x="35" y="105" class="" text-anchor="start">η₁ → η₂</text><text x="330" y="105" class="" text-anchor="start">Z₀ → ZL</text><text x="35" y="170" class="" text-anchor="start">Eᵢ / Eᵣ</text><text x="330" y="170" class="" text-anchor="start">V⁺ / V⁻</text><text x="35" y="235" class="" text-anchor="start">η = E/H</text><text x="330" y="235" class="" text-anchor="start">Z₀ = V/I</text><text x="35" y="300" class="" text-anchor="start">材料行波比</text><text x="330" y="300" class="" text-anchor="start">線路行波比</text><rect x="24" y="360" width="552" height="142" rx="12" fill="#17283b"/><text x="42" y="395" class="" text-anchor="start">Γ = (η₂ − η₁)/(η₂ + η₁)</text><text x="42" y="435" class="" text-anchor="start">ΓL = (ZL − Z₀)/(ZL + Z₀)</text><text x="42" y="475" class="" text-anchor="start">都用 Ω，但物理量不可任意互換。</text><rect x="24" y="525" width="552" height="142" rx="12" fill="#17283b"/><text x="42" y="560" class="" text-anchor="start">固定 q = 2：τ = 4/3</text><text x="42" y="600" class="" text-anchor="start">R = 1/9；T = 8/9</text><text x="42" y="640" class="" text-anchor="start">透射場較大，平均能量仍守恆。</text><text x="35" y="705" class="" text-anchor="start">VNA 的 S21 不直接等於 Eₜ/Eᵢ。</text><text x="35" y="750" class="" text-anchor="start">反射少，也可能是吸收或散射。</text></svg>
