<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 445" role="img" aria-labelledby="eminterface-ratio-figure-title eminterface-ratio-figure-desc"><title id="eminterface-ratio-figure-title">波阻抗比與場分配</title><desc id="eminterface-ratio-figure-desc">固定入射電場十，反射與透射場按波阻抗比變化，所有電場箭頭共尺度。</desc><defs><marker id="eminterface-ratio-figure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eef3f6"/></marker></defs><rect width="600" height="445" fill="#111f30"/><text x="30" y="35" class="" text-anchor="start">電場 E（V/m）；共用尺度與正方向</text><line  x1="70" y1="240" x2="140" y2="240" stroke="#71889b" stroke-width="3" /><line id="eminterface-dynamic-e0" x1="105" y1="240" x2="105" y2="160" stroke="#78e2ca" stroke-width="3"  marker-end="url(#eminterface-ratio-figure-arrow)"/><text x="105" y="320" class="" text-anchor="middle">入射</text><line  x1="250" y1="240" x2="320" y2="240" stroke="#71889b" stroke-width="3" /><line id="eminterface-dynamic-e1" x1="285" y1="240" x2="285" y2="266.6666666666667" stroke="#ffc67b" stroke-width="3"  marker-end="url(#eminterface-ratio-figure-arrow)"/><text x="285" y="320" class="" text-anchor="middle">反射</text><line  x1="430" y1="240" x2="500" y2="240" stroke="#71889b" stroke-width="3" /><line id="eminterface-dynamic-e2" x1="465" y1="240" x2="465" y2="186.66666666666666" stroke="#8db8ff" stroke-width="3"  marker-end="url(#eminterface-ratio-figure-arrow)"/><text x="465" y="320" class="" text-anchor="middle">透射</text><text x="30" y="365" class="" text-anchor="start">+x 向上；箭頭長度按場大小繪製。</text><text x="30" y="410" class="" text-anchor="start">反射波的傳播方向始終為 −z。</text><text id="eminterface-zero" x="190" y="120" hidden="hidden">無反射</text></svg>
