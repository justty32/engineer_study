<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="eminterface-geometry-title eminterface-geometry-desc"><title id="eminterface-geometry-title">三波方向</title><desc id="eminterface-geometry-desc">左側介質一，右側介質二；入射與透射向右，反射向左；固定正x向上、正y朝紙外。</desc><defs><marker id="eminterface-geometry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eef3f6"/></marker></defs><rect width="600" height="660" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">介質 1：η₁ = η₀</text><text x="335" y="40" class="" text-anchor="start">介質 2：η₂ = η₀/2</text><line  x1="310" y1="70" x2="310" y2="440" stroke="#71889b" stroke-width="3" /><text x="320" y="475" class="" text-anchor="start">z = 0</text><line  x1="65" y1="130" x2="240" y2="130" stroke="#78e2ca" stroke-width="3"  marker-end="url(#eminterface-geometry-arrow)"/><text x="65" y="108" class="" text-anchor="start">入射 +z</text><line  x1="240" y1="240" x2="65" y2="240" stroke="#ffc67b" stroke-width="3"  marker-end="url(#eminterface-geometry-arrow)"/><text x="65" y="275" class="" text-anchor="start">反射 −z</text><line  x1="355" y1="130" x2="540" y2="130" stroke="#8db8ff" stroke-width="3"  marker-end="url(#eminterface-geometry-arrow)"/><text x="355" y="108" class="" text-anchor="start">透射 +z</text><line  x1="125" y1="210" x2="125" y2="165" stroke="#78e2ca" stroke-width="3"  marker-end="url(#eminterface-geometry-arrow)"/><text x="140" y="210" class="" text-anchor="start">E 正向 +x</text><line  x1="125" y1="385" x2="125" y2="340" stroke="#78e2ca" stroke-width="3"  marker-end="url(#eminterface-geometry-arrow)"/><text x="140" y="385" class="" text-anchor="start">E 正向 +x</text><line  x1="445" y1="210" x2="445" y2="165" stroke="#78e2ca" stroke-width="3"  marker-end="url(#eminterface-geometry-arrow)"/><text x="460" y="210" class="" text-anchor="start">E 正向 +x</text><text x="340" y="340" class="" text-anchor="start">⊙ +y 出紙面</text><line  x1="350" y1="405" x2="540" y2="405" stroke="#71889b" stroke-width="3"  marker-end="url(#eminterface-geometry-arrow)"/><text x="440" y="435" class="" text-anchor="start">+z 向右</text><rect x="24" y="495" width="552" height="142" rx="12" fill="#17283b"/><text x="42" y="530" class="" text-anchor="start">μr₁ = μr₂ = 1</text><text x="42" y="570" class="" text-anchor="start">εr₁ = 1；εr₂ = 4</text><text x="42" y="610" class="" text-anchor="start">箭頭僅方向示意，尚未指定場振幅。</text></svg>
