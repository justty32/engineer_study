<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="eminterface-budget-title eminterface-budget-desc"><title id="eminterface-budget-title">平均能量帳</title><desc id="eminterface-budget-desc">入射向右九份，反射向左一份，透射向右八份，三箭頭按同尺度。</desc><defs><marker id="eminterface-budget-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eef3f6"/></marker></defs><rect width="600" height="680" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">平均能流：W/m²（箭頭共尺度）</text><text x="35" y="105" class="" text-anchor="start">入射 → 0.1327209364</text><line  x1="60" y1="140" x2="510" y2="140" stroke="#78e2ca" stroke-width="3"  marker-end="url(#eminterface-budget-arrow)"/><text x="35" y="235" class="" text-anchor="start">← 反射 0.0147467707</text><line  x1="110" y1="270" x2="60" y2="270" stroke="#ffc67b" stroke-width="3"  marker-end="url(#eminterface-budget-arrow)"/><text x="35" y="365" class="" text-anchor="start">透射 → 0.1179741657</text><line  x1="60" y1="400" x2="460" y2="400" stroke="#8db8ff" stroke-width="3"  marker-end="url(#eminterface-budget-arrow)"/><rect x="24" y="450" width="552" height="142" rx="12" fill="#17283b"/><text x="42" y="485" class="" text-anchor="start">長度比：9 : 1 : 8</text><text x="42" y="525" class="" text-anchor="start">R = 1/9；T = 8/9</text><text x="42" y="565" class="" text-anchor="start">Sᵢ − |Sᵣ| = Sₜ</text><text x="35" y="640" class="" text-anchor="start">反射有向分量為負；R 記正大小。</text></svg>
