<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" role="img" aria-labelledby="eminterface-magnetic-title eminterface-magnetic-desc"><title id="eminterface-magnetic-title">反射磁場負號</title><desc id="eminterface-magnetic-desc">電場按三比一比二，反射向下；磁場三個皆向紙外，大小按三比一比四。</desc><defs><marker id="eminterface-magnetic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eef3f6"/></marker></defs><rect width="600" height="710" fill="#111f30"/><text x="30" y="35" class="" text-anchor="start">E：V/m（同尺度；+x 向上）</text><line  x1="70" y1="240" x2="140" y2="240" stroke="#71889b" stroke-width="3" /><line  x1="105" y1="240" x2="105" y2="140" stroke="#78e2ca" stroke-width="3"  marker-end="url(#eminterface-magnetic-arrow)"/><text x="105" y="290" class="" text-anchor="middle">入射</text><text x="105" y="330" class="" text-anchor="middle">10.0000</text><line  x1="250" y1="240" x2="320" y2="240" stroke="#71889b" stroke-width="3" /><line  x1="285" y1="240" x2="285" y2="273.3333333333333" stroke="#ffc67b" stroke-width="3"  marker-end="url(#eminterface-magnetic-arrow)"/><text x="285" y="290" class="" text-anchor="middle">反射</text><text x="285" y="330" class="" text-anchor="middle">-3.3333</text><line  x1="430" y1="240" x2="500" y2="240" stroke="#71889b" stroke-width="3" /><line  x1="465" y1="240" x2="465" y2="173.33333333333331" stroke="#8db8ff" stroke-width="3"  marker-end="url(#eminterface-magnetic-arrow)"/><text x="465" y="290" class="" text-anchor="middle">透射</text><text x="465" y="330" class="" text-anchor="middle">6.6667</text><text x="30" y="385" class="" text-anchor="start">H：mA/m（同尺度；⊙ +y／⊗ −y）</text><text x="30" y="435" class="" text-anchor="start">入射 ⊙ 26.5442</text><line  x1="290" y1="427" x2="449.26512372306627" y2="427" stroke="#78e2ca" stroke-width="3" /><text x="30" y="510" class="" text-anchor="start">反射 ⊙ 8.8481</text><line  x1="290" y1="502" x2="343.0883745743554" y2="502" stroke="#ffc67b" stroke-width="3" /><text x="30" y="585" class="" text-anchor="start">透射 ⊙ 35.3922</text><line  x1="290" y1="577" x2="502.35349829742165" y2="577" stroke="#8db8ff" stroke-width="3" /><text x="30" y="680" class="" text-anchor="start">E 與 H 單位不同，不共用尺度。</text></svg>
