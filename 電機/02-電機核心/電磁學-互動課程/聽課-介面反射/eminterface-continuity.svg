<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 725" role="img" aria-labelledby="eminterface-continuity-title eminterface-continuity-desc"><title id="eminterface-continuity-title">總場切向連續</title><desc id="eminterface-continuity-desc">兩個環路跨介面，分別對應法拉第和安培馬克士威定律；高度縮小得到兩個切向條件。</desc><defs><marker id="eminterface-continuity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#eef3f6"/></marker></defs><rect width="600" height="725" fill="#111f30"/><text x="30" y="40" class="" text-anchor="start">介面 z = 0；跨界環路（方向示意）</text><line  x1="300" y1="70" x2="300" y2="390" stroke="#71889b" stroke-width="3" /><rect x="275" y="110" width="50" height="90" fill="none" stroke="#78e2ca" stroke-width="3"/><text x="35" y="90" class="" text-anchor="start">法拉第：切向 E</text><text x="340" y="150" class="" text-anchor="start">跨界厚度 → 0</text><text x="340" y="190" class="" text-anchor="start">面通量項 → 0</text><rect x="275" y="280" width="50" height="90" fill="none" stroke="#78e2ca" stroke-width="3"/><text x="35" y="260" class="" text-anchor="start">安培—馬克士威：切向 H</text><text x="340" y="320" class="" text-anchor="start">跨界厚度 → 0</text><text x="340" y="360" class="" text-anchor="start">面通量項 → 0</text><rect x="24" y="405" width="552" height="142" rx="12" fill="#17283b"/><text x="42" y="440" class="" text-anchor="start">無自由表面電流 → 切向 H 連續</text><text x="42" y="480" class="" text-anchor="start">Eᵢ + Eᵣ = Eₜ</text><text x="42" y="520" class="" text-anchor="start">(Eᵢ − Eᵣ)/η₁ = Eₜ/η₂</text><text x="35" y="605" class="" text-anchor="start">10 − 3.333333 = 6.666667 V/m</text><text x="35" y="650" class="" text-anchor="start">26.544187 + 8.848062</text><text x="35" y="690" class="" text-anchor="start">= 35.392250 mA/m</text></svg>
