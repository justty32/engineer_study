<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 570" role="img" aria-labelledby="eminduct-flux-title eminduct-flux-desc"><title id="eminduct-flux-title">面法向決定磁通正負</title><desc id="eminduct-flux-desc">θ 是 B 與法向的夾角；面片與法向垂直。各角度只比較狀態，沒有把操作速度當作真實轉速。</desc><defs><marker id="eminduct-flux-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="eminduct-flux-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="eminduct-flux-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="eminduct-flux-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="eminduct-flux-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:23px}.muted-text{fill:#a8b7c6}.big-text{font-size:27px;font-weight:650}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="570" fill="#111f30"/><text x="30" y="40" class="muted-text" text-anchor="start">側視幾何；所有箭頭為方向示意</text><line x1="300" y1="245" x2="500" y2="245" class="blue" marker-end="url(#eminduct-flux-blue-arrow)"/><text x="505" y="280" class="" text-anchor="start">B</text><line x1="213.39745962155615" y1="195.0" x2="386.60254037844385" y2="295.0" class="amber" id="eminduct-plane"/><line x1="300" y1="245" x2="370.0" y2="123.7564434701786" class="mint" marker-end="url(#eminduct-flux-mint-arrow)" id="eminduct-normal"/><circle cx="300" cy="245" r="5" class="amber-fill"/><text x="382.0" y="113.7564434701786" class="" text-anchor="start" id="eminduct-normal-label">n̂</text><path d="M350 245 A50 50 0 0 0 325 201.7" class="pink" id="eminduct-angle-arc"/><text x="360" y="205" class="" text-anchor="start" id="eminduct-angle-label">60°</text><text x="35" y="390" class="" text-anchor="start">橘線：面片側視；綠箭頭：面法向</text><text x="35" y="435" class="" text-anchor="start">B = 0.30 T；A = 0.02 m²</text><text x="35" y="485" class="big-text" text-anchor="start" id="eminduct-flux-reading">Φ = BA cos θ = +3.000 mWb</text><text x="35" y="530" class="muted-text" text-anchor="start">滑桿比較靜態角度；未指定轉動時間</text></svg>
