<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 715" role="img" aria-labelledby="eminduct-mutual-title eminduct-mutual-desc"><title id="eminduct-mutual-title">開路也能量到感應電壓</title><desc id="eminduct-mutual-desc">兩線圈電壓均上正下負、電流參考均進點端。第二側開路，i₂ 與 di₂/dt 為零；線圈圖只示意繞組及點端。</desc><defs><marker id="eminduct-mutual-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="eminduct-mutual-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="eminduct-mutual-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="eminduct-mutual-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="eminduct-mutual-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:23px}.muted-text{fill:#a8b7c6}.big-text{font-size:27px;font-weight:650}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="715" fill="#111f30"/><text x="30" y="35" class="muted-text" text-anchor="start">兩側上端為點端；電流參考皆進點</text><line x1="160" y1="85" x2="160" y2="140" class="blue"/><line x1="160" y1="330" x2="160" y2="390" class="blue"/><circle cx="185" cy="140" r="6" class="amber-fill"/><text x="115" y="140" class="" text-anchor="start">+</text><text x="115" y="350" class="" text-anchor="start">−</text><path d="M160 140 C220 140 220 178 160 178 C220 178 220 216 160 216 C220 216 220 254 160 254 C220 254 220 292 160 292 C220 292 220 330 160 330" class="blue"/><line x1="160" y1="70" x2="160" y2="120" class="mint" marker-end="url(#eminduct-mutual-mint-arrow)"/><line x1="430" y1="85" x2="430" y2="140" class="blue"/><line x1="430" y1="330" x2="430" y2="390" class="blue"/><circle cx="455" cy="140" r="6" class="amber-fill"/><text x="385" y="140" class="" text-anchor="start">+</text><text x="385" y="350" class="" text-anchor="start">−</text><path d="M430 140 C490 140 490 178 430 178 C490 178 490 216 430 216 C490 216 490 254 430 254 C490 254 490 292 430 292 C490 292 490 330 430 330" class="blue"/><line x1="430" y1="70" x2="430" y2="120" class="mint" marker-end="url(#eminduct-mutual-mint-arrow)"/><text x="90" y="70" class="" text-anchor="start">i₁</text><text x="475" y="80" class="" text-anchor="start">i₂ = 0</text><text x="90" y="430" class="" text-anchor="start">L₁ = 20 mH</text><text x="350" y="430" class="" text-anchor="start">L₂ = 5 mH</text><text x="160" y="480" class="" text-anchor="middle">v₁ = +2 V</text><text x="430" y="480" class="" text-anchor="middle">v₂ = +.50 V</text><text x="30" y="540" class="" text-anchor="start">k = .5 → M = 5 mH</text><text x="30" y="585" class="" text-anchor="start">di₁/dt = 100 A/s；第二側開路</text><text x="30" y="630" class="" text-anchor="start">電表反接 → −.50 V，耦合不變</text><text x="30" y="675" class="" text-anchor="start">方向示意；開路電壓 ≠ 輸出功率</text></svg>
