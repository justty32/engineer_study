<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 575" role="img" aria-labelledby="eminduct-lenz-title eminduct-lenz-desc"><title id="eminduct-lenz-title">外場同向，回應可反向</title><desc id="eminduct-lenz-desc">兩固定閉合電阻環，外加 B 均朝外。左 dB/dt &gt; 0；右 dB/dt &lt; 0。中央符號表示感應電流所生的回應場。</desc><defs><marker id="eminduct-lenz-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="eminduct-lenz-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="eminduct-lenz-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="eminduct-lenz-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="eminduct-lenz-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:23px}.muted-text{fill:#a8b7c6}.big-text{font-size:27px;font-weight:650}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="575" fill="#111f30"/><text x="150" y="40" class="" text-anchor="middle">外場增加</text><text x="450" y="40" class="" text-anchor="middle">外場減少</text><circle cx="150" cy="205" r="85" class="axis"/><text x="150" y="95" class="" text-anchor="middle">外 B：⊙ 出紙</text><circle cx="450" cy="205" r="85" class="axis"/><text x="450" y="95" class="" text-anchor="middle">外 B：⊙ 出紙</text><path d="M65 205 A85 85 0 0 1 235 205" class="amber" marker-end="url(#eminduct-lenz-amber-arrow)"/><path d="M535 205 A85 85 0 0 0 365 205" class="mint" marker-end="url(#eminduct-lenz-mint-arrow)"/><text x="150" y="218" class="big-text" text-anchor="middle">⊗</text><text x="450" y="218" class="big-text" text-anchor="middle">⊙</text><text x="150" y="330" class="" text-anchor="middle">電流順時針</text><text x="450" y="330" class="" text-anchor="middle">電流逆時針</text><text x="150" y="375" class="" text-anchor="middle">回應 B 入紙</text><text x="450" y="375" class="" text-anchor="middle">回應 B 出紙</text><text x="30" y="445" class="" text-anchor="start">⊙ 出紙；⊗ 入紙；箭頭為方向示意</text><text x="30" y="490" class="" text-anchor="start">回應反抗變化，不一定抵消外場</text><text x="30" y="535" class="" text-anchor="start">量測須控制探線所圍的面積</text></svg>
