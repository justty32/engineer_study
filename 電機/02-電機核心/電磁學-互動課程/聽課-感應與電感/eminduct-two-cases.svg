<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="eminduct-two-cases-title eminduct-two-cases-desc"><title id="eminduct-two-cases-title">辨認真正改變的量</title><desc id="eminduct-two-cases-desc">上：固定面中的 B 改變；下：固定 B 中的面積改變。數值與機制各有條件，不宣稱兩者可無條件互換。</desc><defs><marker id="eminduct-two-cases-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="eminduct-two-cases-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="eminduct-two-cases-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="eminduct-two-cases-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="eminduct-two-cases-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:23px}.muted-text{fill:#a8b7c6}.big-text{font-size:27px;font-weight:650}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="720" fill="#111f30"/><text x="30" y="40" class="big-text" text-anchor="start">固定面：場在變</text><rect x="60" y="75" width="160" height="140" class="blue"/><text x="140" y="155" class="" text-anchor="middle">⊙</text><text x="260" y="110" class="" text-anchor="start">A = .02 m²</text><text x="260" y="160" class="" text-anchor="start">dB/dt = .20 T/s</text><text x="260" y="210" class="" text-anchor="start">ℰ = −4 mV</text><text x="30" y="265" class="" text-anchor="start">邊界不動；局部磁場隨時間改變</text><text x="30" y="340" class="big-text" text-anchor="start">固定場：邊界在動</text><path d="M60 390 H220 V530 H60 Z" class="blue"/><line x1="220" y1="460" x2="300" y2="460" class="mint" marker-end="url(#eminduct-two-cases-mint-arrow)"/><text x="140" y="470" class="" text-anchor="middle">⊙</text><text x="320" y="405" class="" text-anchor="start">B = .20 T</text><text x="320" y="455" class="" text-anchor="start">dA/dt = 1.5</text><text x="320" y="490" class="" text-anchor="start">m²/s</text><text x="320" y="535" class="" text-anchor="start">ℰ = −.30 V</text><text x="30" y="590" class="" text-anchor="start">本導軌理想滑接；逐段指定運動速度</text><text x="30" y="635" class="" text-anchor="start">正向皆逆時針；箭頭僅示方向</text><text x="30" y="680" class="" text-anchor="start">開路可有電壓，幾乎無負載制動</text></svg>
