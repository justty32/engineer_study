<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 595" role="img" aria-labelledby="eminduct-rod-title eminduct-rod-desc"><title id="eminduct-rod-title">先鎖幾何，再讀極性</title><desc id="eminduct-rod-desc">桿向右、磁場出紙；速度叉磁場向下。開路電場向上；閉路傳統電流沿右桿向下、整圈順時針。</desc><defs><marker id="eminduct-rod-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="eminduct-rod-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="eminduct-rod-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="eminduct-rod-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="eminduct-rod-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:23px}.muted-text{fill:#a8b7c6}.big-text{font-size:27px;font-weight:650}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="595" fill="#111f30"/><text x="30" y="35" class="muted-text" text-anchor="start">xy 紙面；+z 出紙；方向示意</text><path d="M115 130 H420 V370 H115 V280 M115 200 V130" class="blue"/><rect x="100" y="200" width="30" height="80" class="amber"/><text x="35" y="250" class="" text-anchor="start">R</text><text x="210" y="200" class="" text-anchor="middle">⊙</text><text x="210" y="290" class="" text-anchor="middle">⊙</text><text x="300" y="200" class="" text-anchor="middle">⊙</text><text x="300" y="290" class="" text-anchor="middle">⊙</text><line x1="420" y1="130" x2="420" y2="370" class="amber"/><line x1="445" y1="175" x2="445" y2="300" class="mint" marker-end="url(#eminduct-rod-mint-arrow)"/><text x="465" y="245" class="" text-anchor="start">I</text><line x1="420" y1="100" x2="535" y2="100" class="mint" marker-end="url(#eminduct-rod-mint-arrow)"/><text x="480" y="75" class="" text-anchor="middle">u = 3 m/s</text><text x="435" y="145" class="" text-anchor="start">−</text><text x="435" y="380" class="" text-anchor="start">+</text><line x1="390" y1="320" x2="390" y2="180" class="pink" marker-end="url(#eminduct-rod-pink-arrow)"/><text x="310" y="255" class="" text-anchor="start">E開路</text><text x="235" y="410" class="" text-anchor="middle">B = .20 T；ℓ = .50 m</text><text x="30" y="465" class="" text-anchor="start">u × B 向下；開路 E 向上</text><text x="30" y="510" class="" text-anchor="start">逆時針為正：ℰ = −.30 V</text><text x="30" y="555" class="" text-anchor="start">開路：底端 − 頂端 = +.30 V</text></svg>
