<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="eminduct-linkage-title eminduct-linkage-desc"><title id="eminduct-linkage-title">匝數為何出現平方</title><desc id="eminduct-linkage-desc">長空心線圈，忽略端部與外場，幾何固定。圖中圈數是示意；計算用 N = 500。下一圖改用另一個 20 mH 線圈。</desc><defs><marker id="eminduct-linkage-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="eminduct-linkage-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="eminduct-linkage-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="eminduct-linkage-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="eminduct-linkage-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:23px}.muted-text{fill:#a8b7c6}.big-text{font-size:27px;font-weight:650}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="680" fill="#111f30"/><text x="30" y="40" class="muted-text" text-anchor="start">長空心線圈；共同磁通方向示意</text><rect x="70" y="95" width="450" height="130" class="axis dash"/><ellipse cx="100" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="140" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="180" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="220" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="260" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="300" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="340" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="380" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="420" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="460" cy="160" rx="18" ry="80" class="blue"/><ellipse cx="500" cy="160" rx="18" ry="80" class="blue"/><line x1="55" y1="160" x2="550" y2="160" class="mint" marker-end="url(#eminduct-linkage-mint-arrow)"/><text x="300" y="280" class="" text-anchor="middle">N = 500；ℓ = .20 m</text><text x="300" y="325" class="" text-anchor="middle">A = 1 cm² = 10⁻⁴ m²</text><text x="30" y="385" class="" text-anchor="start">I = 2 A → B = 6.283185 mT</text><text x="30" y="435" class="" text-anchor="start">單匝 Φ = .628319 μWb</text><text x="30" y="485" class="" text-anchor="start">磁鏈 λ = .314159 mWb·turn</text><text x="30" y="535" class="" text-anchor="start">L = .157080 mH</text><text x="30" y="595" class="" text-anchor="start">N × 2 → 場 × 2 → 磁鏈 × 4</text><text x="30" y="640" class="" text-anchor="start">磁鏈是逐匝加總，不是單截面磁通</text></svg>
