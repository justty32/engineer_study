<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="eminduct-slope-title eminduct-slope-desc"><title id="eminduct-slope-title">看斜率，不只看大小</title><desc id="eminduct-slope-desc">固定單匝 A = .02 m²。正 Bz 朝紙外；電動勢取逆時針正向。兩個轉折點左右導數不同。</desc><defs><marker id="eminduct-slope-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="eminduct-slope-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="eminduct-slope-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="eminduct-slope-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker><marker id="eminduct-slope-axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71889b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:23px}.muted-text{fill:#a8b7c6}.big-text{font-size:27px;font-weight:650}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}.axis{stroke:#71889b;fill:none;stroke-width:3}.axis-fill{fill:#71889b}</style><rect width="600" height="780" fill="#111f30"/><text x="30" y="35" class="muted-text" text-anchor="start">Bz（T）↑；法向出紙、正向逆時針</text><line x1="85" y1="260" x2="540" y2="260" class="axis"/><line x1="85" y1="260" x2="85" y2="55" class="axis"/><line x1="85" y1="260" x2="520" y2="260" class="grid"/><text x="70" y="267" class="" text-anchor="end">0.0</text><line x1="85" y1="210.0" x2="520" y2="210.0" class="grid"/><text x="70" y="217.0" class="" text-anchor="end">0.1</text><line x1="85" y1="160.0" x2="520" y2="160.0" class="grid"/><text x="70" y="167.0" class="" text-anchor="end">0.2</text><line x1="85" y1="110.0" x2="520" y2="110.0" class="grid"/><text x="70" y="117.0" class="" text-anchor="end">0.3</text><line x1="85" y1="60.0" x2="520" y2="60.0" class="grid"/><text x="70" y="67.0" class="" text-anchor="end">0.4</text><text x="85" y="295" class="" text-anchor="middle">0</text><text x="230" y="295" class="" text-anchor="middle">1</text><text x="375" y="295" class="" text-anchor="middle">2</text><text x="520" y="295" class="" text-anchor="middle">3</text><text x="540" y="325" class="" text-anchor="end">t（s）</text><path d="M85 210 L230 110 L375 110 L520 210" class="mint"/><text x="30" y="365" class="muted-text" text-anchor="start">ℰ（mV）↑</text><line x1="85" y1="485" x2="540" y2="485" class="axis"/><line x1="85" y1="580" x2="85" y2="385" class="axis"/><line x1="85" y1="565" x2="520" y2="565" class="grid"/><text x="70" y="572" class="" text-anchor="end">-4</text><line x1="85" y1="485" x2="520" y2="485" class="grid"/><text x="70" y="492" class="" text-anchor="end">0</text><line x1="85" y1="405" x2="520" y2="405" class="grid"/><text x="70" y="412" class="" text-anchor="end">4</text><text x="85" y="615" class="" text-anchor="middle">0</text><text x="230" y="615" class="" text-anchor="middle">1</text><text x="375" y="615" class="" text-anchor="middle">2</text><text x="520" y="615" class="" text-anchor="middle">3</text><line x1="85" y1="565" x2="230" y2="565" class="amber"/><circle cx="230" cy="565" r="5" stroke="#ffc67b" fill="#111f30" stroke-width="2"/><line x1="230" y1="485" x2="375" y2="485" class="amber"/><circle cx="230" cy="485" r="5" stroke="#ffc67b" fill="#111f30" stroke-width="2"/><circle cx="375" cy="485" r="5" stroke="#ffc67b" fill="#111f30" stro