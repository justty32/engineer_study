<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-labelledby="emfield-contours-title"><title id="emfield-contours-title">等差電位，間距透露場強</title><defs><marker id="emfield-contours-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emfield-contours-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emfield-contours-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emfield-contours-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:22px}.axis{stroke:#71889b;stroke-width:1.5}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.muted-text{fill:#a8b7c6}.big-text{font-size:26px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}</style><rect width="600" height="850" fill="#111f30"/><text x="30" y="35" class="muted-text" text-anchor="start">等差電位，每跨一圈差 5 V</text><circle cx="300" cy="300" r="108.0" class="mint"/><circle cx="300" cy="300" r="129.6" class="blue"/><circle cx="300" cy="300" r="162.0" class="amber"/><circle cx="300" cy="300" r="216.0" class="pink"/><circle cx="300" cy="300" r="5" fill="#ffc67b"/><text x="300" y="335" class="" text-anchor="middle">Q</text><line x1="402.5304832720494" y1="197.46951672795063" x2="437.88582233137674" y2="162.11417766862326" class="mint" marker-end="url(#emfield-contours-mint-arrow)"/><line x1="197.46951672795058" y1="402.53048327204937" x2="162.1141776686232" y2="437.88582233137674" class="mint" marker-end="url(#emfield-contours-mint-arrow)"/><line x1="45" y1="568" x2="95" y2="568" class="mint"/><text x="115" y="575" class="mint-fill" text-anchor="start">30 V  →  r = .30 m</text><line x1="45" y1="610" x2="95" y2="610" class="blue"/><text x="115" y="617" class="blue-fill" text-anchor="start">25 V  →  r = .36 m</text><line x1="45" y1="652" x2="95" y2="652" class="amber"/><text x="115" y="659" class="amber-fill" text-anchor="start">20 V  →  r = .45 m</text><line x1="45" y1="694" x2="95" y2="694" class="pink"/><text x="115" y="701" class="pink-fill" text-anchor="start">15 V  →  r = .60 m</text><text x="30" y="765" class="" text-anchor="start">由內向外；間距 .06 / .09 / .15 m</text><text x="30" y="810" class="" text-anchor="start">箭頭只示方向；不代表場強大小</text></svg>
