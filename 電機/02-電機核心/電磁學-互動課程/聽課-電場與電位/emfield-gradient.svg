<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 685" role="img" aria-labelledby="emfield-gradient-title"><title id="emfield-gradient-title">梯度向高，電場向低</title><defs><marker id="emfield-gradient-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emfield-gradient-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emfield-gradient-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emfield-gradient-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:22px}.axis{stroke:#71889b;stroke-width:1.5}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.muted-text{fill:#a8b7c6}.big-text{font-size:26px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}</style><rect width="600" height="685" fill="#111f30"/><text x="30" y="35" class="muted-text" text-anchor="start">P 附近的向量圖（V/m）</text><line x1="130" y1="315" x2="500" y2="315" class="axis"/><line x1="300" y1="510" x2="300" y2="100" class="axis"/><line x1="300" y1="315" x2="420" y2="155" class="mint" marker-end="url(#emfield-gradient-mint-arrow)"/><line x1="300" y1="315" x2="180" y2="475" class="amber" marker-end="url(#emfield-gradient-amber-arrow)"/><line x1="156" y1="207" x2="444" y2="423" class="blue dash"/><line x1="300" y1="315" x2="420" y2="315" class="mint dash"/><line x1="420" y1="315" x2="420" y2="155" class="mint dash"/><line x1="300" y1="315" x2="180" y2="315" class="amber dash"/><line x1="180" y1="315" x2="180" y2="475" class="amber dash"/><circle cx="300" cy="315" r="5" fill="#ffc67b"/><text x="430" y="155" class="" text-anchor="start">E</text><text x="135" y="500" class="" text-anchor="start">∇V</text><text x="340" y="350" class="" text-anchor="start">+60</text><text x="440" y="255" class="" text-anchor="start">+80</text><text x="180" y="290" class="" text-anchor="start">−60</text><text x="100" y="405" class="" text-anchor="start">−80</text><text x="65" y="170" class="" text-anchor="start">切向</text><text x="312" y="300" class="" text-anchor="start">P</text><path d="M310.8 300.6 L296.4 289.8 L285.6 304.2" class="blue"/><text x="30" y="555" class="" text-anchor="start">E = (60, 80)；∇V = (−60, −80)</text><text x="30" y="600" class="" text-anchor="start">切向 u = (−.8, .6)：∇V · u = 0</text><text x="30" y="645" class="" text-anchor="start">P 是觀測點；不是來源位置 O</text></svg>
