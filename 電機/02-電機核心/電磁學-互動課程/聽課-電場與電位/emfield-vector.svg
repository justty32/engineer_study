<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="emfield-vector-title"><title id="emfield-vector-title">位置與電場，分開讀</title><defs><marker id="emfield-vector-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emfield-vector-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emfield-vector-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emfield-vector-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:22px}.axis{stroke:#71889b;stroke-width:1.5}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.muted-text{fill:#a8b7c6}.big-text{font-size:26px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}</style><rect width="600" height="650" fill="#111f30"/><text x="30" y="35" class="muted-text" text-anchor="start">位置（m）：O → P</text><line x1="110" y1="255" x2="445" y2="255" class="axis"/><line x1="110" y1="255" x2="110" y2="65" class="axis"/><line x1="110" y1="255" x2="245" y2="75" class="mint" marker-end="url(#emfield-vector-mint-arrow)"/><line x1="110" y1="255" x2="245" y2="255" class="blue"/><line x1="245" y1="255" x2="245" y2="75" class="blue dash"/><circle cx="110" cy="255" r="5" fill="#ffc67b"/><circle cx="245" cy="75" r="5" fill="#ffc67b"/><text x="75" y="290" class="" text-anchor="start">O</text><text x="265" y="75" class="" text-anchor="start">P (.18, .24)</text><text x="160" y="287" class="" text-anchor="start">.18 m</text><text x="265" y="180" class="" text-anchor="start">.24 m</text><text x="70" y="150" class="" text-anchor="start">.30 m</text><text x="30" y="345" class="muted-text" text-anchor="start">電場（V/m）：同一支箭頭的分量</text><line x1="110" y1="575" x2="445" y2="575" class="axis"/><line x1="110" y1="575" x2="110" y2="375" class="axis"/><line x1="110" y1="575" x2="254" y2="383" class="mint" marker-end="url(#emfield-vector-mint-arrow)"/><line x1="110" y1="575" x2="254" y2="575" class="blue" marker-end="url(#emfield-vector-blue-arrow)"/><line x1="254" y1="575" x2="254" y2="383" class="blue dash"/><text x="140" y="615" class="" text-anchor="start">60</text><text x="275" y="490" class="" text-anchor="start">80</text><text x="280" y="405" class="" text-anchor="start">|E| = 100</text></svg>
