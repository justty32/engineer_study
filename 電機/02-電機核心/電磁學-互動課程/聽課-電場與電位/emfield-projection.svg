<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 545" role="img" aria-labelledby="emfield-projection-title"><title id="emfield-projection-title">同一個場，換方向讀</title><defs><marker id="emfield-projection-mint-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78e2ca"/></marker><marker id="emfield-projection-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc67b"/></marker><marker id="emfield-projection-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8db8ff"/></marker><marker id="emfield-projection-pink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ef9dbb"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#eef3f6;font-size:22px}.axis{stroke:#71889b;stroke-width:1.5}.grid{stroke:#2a3d51;stroke-width:1}.dash{stroke-dasharray:6 5}.muted-text{fill:#a8b7c6}.big-text{font-size:26px;font-weight:650}.mint{stroke:#78e2ca;fill:none;stroke-width:3}.mint-fill{fill:#78e2ca}.amber{stroke:#ffc67b;fill:none;stroke-width:3}.amber-fill{fill:#ffc67b}.blue{stroke:#8db8ff;fill:none;stroke-width:3}.blue-fill{fill:#8db8ff}.pink{stroke:#ef9dbb;fill:none;stroke-width:3}.pink-fill{fill:#ef9dbb}</style><rect width="600" height="545" fill="#111f30"/><text x="25" y="40" class="big-text" text-anchor="start">沿 +x 讀 60</text><text x="325" y="40" class="big-text" text-anchor="start">沿 E 讀 100</text><line x1="55" y1="300" x2="255" y2="300" class="axis"/><line x1="55" y1="300" x2="199" y2="108" class="mint" marker-end="url(#emfield-projection-mint-arrow)"/><line x1="345" y1="300" x2="545" y2="300" class="axis"/><line x1="345" y1="300" x2="489" y2="108" class="mint" marker-end="url(#emfield-projection-mint-arrow)"/><line x1="55" y1="300" x2="199" y2="300" class="amber" marker-end="url(#emfield-projection-amber-arrow)"/><line x1="199" y1="300" x2="199" y2="108" class="blue dash"/><line x1="345" y1="300" x2="489" y2="108" class="amber dash" marker-end="url(#emfield-projection-amber-arrow)"/><text x="110" y="340" class="" text-anchor="start">60</text><text x="365" y="125" class="" text-anchor="start">100</text><text x="45" y="400" class="" text-anchor="start">同一個 E = (60, 80) V/m</text><text x="45" y="455" class="" text-anchor="start">沿 −x：−60 V/m</text><text x="45" y="500" class="" text-anchor="start">沿垂直 E 的方向：0 V/m</text></svg>
