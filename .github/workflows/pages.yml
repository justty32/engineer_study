      - "專題/IoT聯網裝置/知識群互動網站/05-裝置安全與量產生命週期/styles.css"
      - "專題/IoT聯網裝置/知識群互動網站/05-裝置安全與量產生命週期/app.js"
      - "專題/IoT聯網裝置/知識群互動網站/06-板級介面與工業匯流排/*.html"
