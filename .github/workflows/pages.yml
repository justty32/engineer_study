      - "專題/網路協定/互動課程/*.css"
      - "專題/網路協定/互動課程/*.js"
      - "專題/逆向工程/互動課程/*.html"
      - "專題/逆向工程/互動課程/*.css"
      - "專題/逆向工程/互動課程/*.js"
      - "專題/計算機組織/互動課程/*.html"
      - "專題/計算機組織/互動課程/*.css"
      - "專題/計算機組織/互動課程/*.js"
      - "專題/作業系統/互動課程/*.html"
      - "專題/作業系統/互動課程/*.css"
      - "專題/作業系統/互動課程/*.js"
      - "專題/機器人運動學/互動課程/*.html"
      - "專題/機器人運動學/互動課程/*.css"
      - "專題/機器人運動學/互動課程/*.js"
      - "專題/機器人路徑規劃/互動課程/*.html"
      - "專題/機器人路徑規劃/互動課程/*.css"
      - "專題/機器人路徑規劃/互動課程/*.js"
      - "專題/機器人視覺/互動課程/*.html"
      - "專題/機器人視覺/互動課程/*.css"
      - "專題/機器人視覺/互動課程/*.js"
      - "專題/機器人學習/互動課程/*.html"
      - "專題/機器人學習/互動課程/*.css"
      - "專題/機器人學習/互動課程/*.js"
      - "專題/機器人數學基礎/互動課程/*.html"
      - "專題/機器人數學基礎/互動課程/*.css"
      - "專題/機器人數學基礎/互動課程/*.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/iot-device
          cp '互動學習網站/index.html' _site/index.html
          cp '互動學習網站/styles.css' _site/styles.css
          cp '專題/IoT聯網裝置/互動網站/index.html' _site/iot-device/index.html
          cp '專題/IoT聯網裝置/互動網站/styles.css' _site/iot-device/styles.css
          cp '專題/IoT聯網裝置/互動網站/app.js' _site/iot-device/app.js

          power_site='電機/04-電力特化/P1-電力系統-互動網站'
          if [ -f "$power_site/index.html" ] && \
            [ -f "$power_site/styles.css" ] && \
            [ -f "$power_site/app.js" ]; then
            mkdir -p _site/power-systems
            cp "$power_site/index.html" _site/power-systems/index.html
            cp "$power_site/styles.css" _site/power-systems/styles.css
            cp "$power_site/app.js" _site/power-systems/app.js
          fi

          pcb_site='專題/IoT聯網裝置/知識群互動網站/01-板級電源與PCB'
          if [ -f "$pcb_site/index.html" ] && \
            [ -f "$pcb_site/styles.css" ] && \
            [ -f "$pcb_site/app.js" ]; then
            mkdir -p _site/iot-power-pcb
            cp "$pcb_site/index.html" _site/iot-power-pcb/index.html
            cp "$pcb_site/styles.css" _site/iot-power-pcb/styles.css
            cp "$pcb_site/app.js" _site/iot-power-pcb/app.js
          fi

          firmware_site='專題/IoT聯網裝置/知識群互動網站/02-嵌入式韌體與RTOS'
          if [ -f "$firmware_site/index.html" ] && \
            [ -f "$firmware_site/styles.css" ] && \
            [ -f "$firmware_site/app.js" ]; then
            mkdir -p _site/iot-firmware-rtos
            cp "$firmware_site/index.html" _site/iot-firmware-rtos/index.html
            cp "$firmware_site/styles.css" _site/iot-firmware-rtos/styles.css
            cp "$firmware_site/app.js" _site/iot-firmware-rtos/app.js
          fi

          connectivity_site='專題/IoT聯網裝置/知識群互動網站/03-連線模組與網路'
          if [ -f "$connectivity_site/index.html" ] && \
            [ -f "$connectivity_site/styles.css" ] && \
            [ -f "$connectivity_site/app.js" ]; then
            mkdir -p _site/iot-connectivity
            cp "$connectivity_site/index.html" _site/iot-connectivity/index.html
            cp "$connectivity_site/styles.css" _site/iot-connectivity/styles.css
            cp "$connectivity_site/app.js" _site/iot-connectivity/app.js
          fi

          rf_site='專題/IoT聯網裝置/知識群互動網站/04-天線RF與EMC'
          if [ -f "$rf_site/index.html" ] && \
            [ -f "$rf_site/styles.css" ] && \
            [ -f "$rf_site/app.js" ]; then
            mkdir -p _site/iot-rf-antenna
            cp "$rf_site/index.html" _site/iot-rf-antenna/index.html
            cp "$rf_site/styles.css" _site/iot-rf-antenna/styles.css
            cp "$rf_site/app.js" _site/iot-rf-antenna/app.js
          fi

          security_site='專題/IoT聯網裝置/知識群互動網站/05-裝置安全與量產生命週期'
          if [ -f "$security_site/index.html" ] && \
            [ -f "$security_site/styles.css" ] && \
            [ -f "$security_site/app.js" ]; then
            mkdir -p _site/iot-security-production
            cp "$security_site/index.html" _site/iot-security-production/index.html
            cp "$security_site/styles.css" _site/iot-security-production/styles.css
            cp "$security_site/app.js" _site/iot-security-production/app.js
          fi

          copy_course() {
            source_dir="$1"
            public_dir="$2"
            mkdir -p "_site/$public_dir"
            find "$source_dir" -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) \
              -exec cp '{}' "_site/$public_dir/" \;
          }

          copy_course '專題/網路安全/互動課程' network-security
          copy_course '專題/IoT聯網裝置/知識群互動網站/06-板級介面與工業匯流排' iot-hardware-bus
          copy_course '專題/IoT聯網裝置/知識群互動網站/07-微控制器與韌體核心' iot-mcu-firmware
          copy_course '專題/網路安全/攻擊手法細講' attack-techniques
          copy_course '專題/網路協定/互動課程' network-protocols
          copy_course '專題/逆向工程/互動課程' reverse-engineering
          copy_course '專題/計算機組織/互動課程' computer-organization
          copy_course '專題/作業系統/互動課程' operating-systems
          copy_course '專題/機器人運動學/互動課程' robot-arm-kinematics
          copy_course '專題/機器人路徑規劃/互動課程' robot-motion-planning
          copy_course '專題/機器人視覺/互動課程' robot-vision
          copy_course '專題/機器人學習/互動課程' robot-learning
          copy_course '專題/機器人數學基礎/互動課程' robot-math

          python3 <<'PY'
          from pathlib import Path

          replacements = {
              "iot-hardware-bus": {
                  "../07-微控制器與韌體核心/": "../iot-mcu-firmware/",
                  "href=\"./README.md\"": "href=\"https://github.com/justty32/engineer_study/blob/main/專題/IoT聯網裝置/知識群互動網站/06-板級介面與工業匯流排/README.md\"",
              },
              "iot-mcu-firmware": {
                  "../06-板級介面與工業匯流排/": "../iot-hardware-bus/",
              },
              "network-security": {
                  "../攻擊手法細講/": "../attack-techniques/",
                  "../../逆向工程/互動課程/": "../reverse-engineering/",
                  "href=\"PROJECT-BRIEF.md\"": "href=\"https://github.com/justty32/engineer_study/blob/main/專題/網路安全/互動課程/PROJECT-BRIEF.md\"",
              },
              "attack-techniques": {
                  "../互動課程/": "../network-security/",
                  "../../網路協定/互動課程/": "../network-protocols/",
                  "../../逆向工程/互動課程/": "../reverse-engineering/",
              },
              "reverse-engineering": {
                  "../../計算機組織/互動課程/": "../computer-organization/",
              },
              "computer-organization": {
                  "../../逆向工程/互動課程/": "../reverse-engineering/",
              },
              "robot-arm-kinematics": {
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
              "robot-motion-planning": {
                  "../../機器人運動學/互動課程/": "../robot-arm-kinematics/",
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
              "robot-vision": {
                  "../../機器人運動學/互動課程/": "../robot-arm-kinematics/",
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
              "robot-learning": {
                  "../../機器人運動學/互動課程/": "../robot-arm-kinematics/",
                  "../../機器人路徑規劃/互動課程/": "../robot-motion-planning/",
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
          }

          site = Path("_site")
          for public_dir, rules in replacements.items():
              for page in (site / public_dir).glob("*.html"):
                  text = page.read_text(encoding="utf-8")
                  for old, new in rules.items():
                      text = text.replace(old, new)
                  page.write_text(text, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
