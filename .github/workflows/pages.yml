name: Deploy GitHub Pages

# 觸發面說明（設計取捨見 wf/workflows/interactive-study-site/SHARED-ASSETS-EVAL.md）：
# 這裡刻意使用較寬的萬用路徑，而不是逐課列舉三行。理由是新增課程的頻率遠高於
# 其他維運動作，逐課列舉每次要改三處且容易漏。副作用是「尚未登記進課程表的
# 課程目錄」被改動時也會觸發一次部署——該次部署的產出與前一次相同（組站步驟
# 只認課程表），屬可接受的空跑。真正決定「什麼會被發布」的是下面的課程表，
# 不是這裡的觸發條件。
# 只列 html/css/js：規劃用 Markdown（PROJECT-BRIEF、BUILD-SPEC、驗收紀錄、
# README）不發布，改動它們不應觸發部署。
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "互動學習網站/*.html"
      - "互動學習網站/*.css"
      - "互動學習網站/*.js"
      - "共通基礎/*/互動課程/*.html"
      - "共通基礎/*/互動課程/*.css"
      - "共通基礎/*/互動課程/*.js"
      - "專題/*/互動課程/*.html"
      - "專題/*/互動課程/*.css"
      - "專題/*/互動課程/*.js"
      - "專題/網路安全/攻擊手法細講/*.html"
      - "專題/網路安全/攻擊手法細講/*.css"
      - "專題/網路安全/攻擊手法細講/*.js"
      - "專題/IoT聯網裝置/互動網站/*.html"
      - "專題/IoT聯網裝置/互動網站/*.css"
      - "專題/IoT聯網裝置/互動網站/*.js"
      - "專題/IoT聯網裝置/知識群互動網站/*/*.html"
      - "專題/IoT聯網裝置/知識群互動網站/*/*.css"
      - "專題/IoT聯網裝置/知識群互動網站/*/*.js"
      - "電機/*/*互動網站/*.html"
      - "電機/*/*互動網站/*.css"
      - "電機/*/*互動網站/*.js"
      - "電機/*/*互動課程/*.html"
      - "電機/*/*互動課程/*.css"
      - "電機/*/*互動課程/*.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # 主站落在站台根目錄，不屬課程表。
          cp '互動學習網站/index.html' _site/index.html
          cp '互動學習網站/styles.css' _site/styles.css

          # 把來源目錄第一層的 html/css/js 複製到 _site/<slug>/。
          # 規劃用 Markdown 不發布；子目錄不遞迴。
          copy_course() {
            source_dir="$1"
            public_dir="$2"
            if [ ! -d "$source_dir" ]; then
              echo "::error::課程表列出的來源目錄不存在：$source_dir" >&2
              return 1
            fi
            mkdir -p "_site/$public_dir"
            find "$source_dir" -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) \
              -exec cp '{}' "_site/$public_dir/" \;
          }

          # 課程表
          # 每行一門課：<來源目錄>|<部署 slug>
          # 新增課程＝在此加一行。若該課含 ../../<其他課>/ 形式的跨課相對
          # 連結，另需在下方 replacements 加對應 slug 的改寫規則。
          # 建置中的課程交付後才登記；未登記者不會被發布。
          while IFS='|' read -r source_dir public_dir; do
            [ -n "$source_dir" ] || continue
            case "$source_dir" in \#*) continue ;; esac
            copy_course "$source_dir" "$public_dir"
          done <<'COURSES'
          專題/IoT聯網裝置/互動網站|iot-device
          電機/04-電力特化/P1-電力系統-互動網站|power-systems
          專題/IoT聯網裝置/知識群互動網站/01-板級電源與PCB|iot-power-pcb
          專題/IoT聯網裝置/知識群互動網站/02-嵌入式韌體與RTOS|iot-firmware-rtos
          專題/IoT聯網裝置/知識群互動網站/03-連線模組與網路|iot-connectivity
          專題/IoT聯網裝置/知識群互動網站/04-天線RF與EMC|iot-rf-antenna
          專題/IoT聯網裝置/知識群互動網站/05-裝置安全與量產生命週期|iot-security-production
          專題/IoT聯網裝置/知識群互動網站/06-板級介面與工業匯流排|iot-hardware-bus
          專題/IoT聯網裝置/知識群互動網站/07-微控制器與韌體核心|iot-mcu-firmware
          專題/網路安全/互動課程|network-security
          專題/網路安全/攻擊手法細講|attack-techniques
          專題/網路協定/互動課程|network-protocols
          專題/逆向工程/互動課程|reverse-engineering
          專題/計算機組織/互動課程|computer-organization
          專題/作業系統/互動課程|operating-systems
          專題/Linux/互動課程|linux
          專題/機器人運動學/互動課程|robot-arm-kinematics
          專題/機器人路徑規劃/互動課程|robot-motion-planning
          專題/機器人視覺/互動課程|robot-vision
          專題/機器人學習/互動課程|robot-learning
          專題/機器人數學基礎/互動課程|robot-math
          共通基礎/數學/互動課程|engineering-math
          共通基礎/物理/互動課程|general-physics
          電機/02-電機核心/電路學-互動課程|circuit-analysis
          電機/02-電機核心/電子學-互動課程|electronics
          電機/02-電機核心/電磁學-互動課程|electromagnetics
          電機/02-電機核心/信號與系統-互動課程|signals-systems
          電機/02-電機核心/邏輯設計-互動課程|logic-design
          COURSES

          python3 <<'PY'
          from pathlib import Path

          replacements = {
              "iot-hardware-bus": {
                  "../07-微控制器與韌體核心/": "../iot-mcu-firmware/",
                  "href=\"./README.md\"": "href=\"https://github.com/justty32/engineer_study/blob/main/專題/IoT聯網裝置/知識群互動網站/06-板級介面與工業匯流排/README.md\"",
              },
              "iot-mcu-firmware": {
                  "../06-板級介面與工業匯流排/": "../iot-hardware-bus/",
              },
              "network-security": {
                  "../攻擊手法細講/": "../attack-techniques/",
                  "../../逆向工程/互動課程/": "../reverse-engineering/",
                  "href=\"PROJECT-BRIEF.md\"": "href=\"https://github.com/justty32/engineer_study/blob/main/專題/網路安全/互動課程/PROJECT-BRIEF.md\"",
              },
              "attack-techniques": {
                  "../互動課程/": "../network-security/",
                  "../../網路協定/互動課程/": "../network-protocols/",
                  "../../逆向工程/互動課程/": "../reverse-engineering/",
              },
              "reverse-engineering": {
                  "../../計算機組織/互動課程/": "../computer-organization/",
              },
              "computer-organization": {
                  "../../逆向工程/互動課程/": "../reverse-engineering/",
              },
              "robot-arm-kinematics": {
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
              "robot-motion-planning": {
                  "../../機器人運動學/互動課程/": "../robot-arm-kinematics/",
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
              "robot-vision": {
                  "../../機器人運動學/互動課程/": "../robot-arm-kinematics/",
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
              "robot-learning": {
                  "../../機器人運動學/互動課程/": "../robot-arm-kinematics/",
                  "../../機器人數學基礎/互動課程/": "../robot-math/",
              },
              "engineering-math": {
                  "../../../專題/機器人數學基礎/互動課程/": "../robot-math/",
              },
              "general-physics": {
                  "../../數學/互動課程/": "../engineering-math/",
              },
              "circuit-analysis": {
                  "../../../共通基礎/數學/互動課程/": "../engineering-math/",
                  "../../../專題/IoT聯網裝置/知識群互動網站/06-板級介面與工業匯流排/": "../iot-hardware-bus/",
              },
              "electronics": {
                  "../../../共通基礎/數學/互動課程/": "../engineering-math/",
                  "../../../共通基礎/物理/互動課程/": "../general-physics/",
                  "../電路學-互動課程/": "../circuit-analysis/",
              },
              "logic-design": {
                  "../電子學-互動課程/": "../electronics/",
                  "../電路學-互動課程/": "../circuit-analysis/",
                  "../../../專題/計算機組織/互動課程/": "../computer-organization/",
              },
              "signals-systems": {
                  "../../../共通基礎/數學/互動課程/": "../engineering-math/",
                  "../電路學-互動課程/": "../circuit-analysis/",
              },
              "electromagnetics": {
                  "../../../共通基礎/數學/互動課程/": "../engineering-math/",
                  "../../../共通基礎/物理/互動課程/": "../general-physics/",
                  "../電路學-互動課程/": "../circuit-analysis/",
              },
          }

          site = Path("_site")
          for public_dir, rules in replacements.items():
              for page in (site / public_dir).glob("*.html"):
                  text = page.read_text(encoding="utf-8")
                  for old, new in rules.items():
                      text = text.replace(old, new)
                  page.write_text(text, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
