{"deck_id":"symbolic-arc-automata","title":"ARC・符號・自動機 三十分鐘速覽","subtitle":"paper_readings 全庫 150 篇的四條主線・車上版","total_minutes":30,"intro":"四條線問同一件事：一條寫得出來的規則，怎麼從資料裡自動找出來，又怎麼確認它沒錯。ARC 找一段程式，符號迴歸找一條公式，神經符號把邏輯規則接進神經網路，自動機線反過來問神經網路本身能算到哪一級。先讀兩條「搜」的線，再讀兩條「接」的線。","lanes":[{"id":"arc","name":"ARC-AGI 與測試時適應","minutes":7,"paper_count":25,"deep_doc":"https://github.com/justty32/paper_readings/blob/main/deep/ARC_AGI_landscape.md","gist":{"summary":"ARC 給你幾組輸入輸出網格（十色、最大 30×30），要你推出規則再填答案，考的是全新任務，不是事先準備好的技能。六年沒有銀彈，高分系統都是神經網路、程式合成、測試時適應（test-time adaptation）拼裝。2025 年改考更難的 ARC-AGI-2，最高 24%。","points":["歸納（induction）寫程式、轉導（transduction）畫答案，同架構解不同題。","測試時適應動四種東西：微調權重、加概念記憶庫、檢查中間狀態沒走丟、把整題壓成小網路。","測試時訓練（TTT）是單招最大躍進，收益卻綁死底層模型品質，小模型硬套會掉到零。","搜尋救得了輸出網格沒見過的題，救不了程式結構沒見過的題；出路是把每步執行結果餵回搜尋。"],"open":"分不開知識與推理。高分有多少是底層模型早就吃過 ARC 資料，官方自己也量不出來。"},"glossary":[{"term":"歸納（induction）","plain":"先從範例反推出一支能解題的程式，再把程式套到測試輸入上。"},{"term":"轉導（transduction）","plain":"不寫程式，讓神經網路看完範例，直接生出測試題的答案網格。"},{"term":"測試時適應（test-time adaptation）","plain":"作答時才針對這一題做調整的統稱。TTT 是其中改權重的那條，另三條不動權重。"},{"term":"測試時訓練（TTT）","plain":"「測試時」指模型作答的當下，不是軟體測試。拿這題自己的範例臨時做幾步梯度更新再答。"},{"term":"低秩適配器（LoRA）","plain":"原權重不動，只掛一小組外加參數就改變模型行為；低秩＝這組參數壓得很小。"},{"term":"專家乘積（PoE）","plain":"同一題旋轉、翻轉、換色成多個視角各解一次，合併各視角的信心分數，各視角都認可的答案才出線。"},{"term":"留一法（leave-one-out）","plain":"輪流抽掉一組範例當考題、其餘當提示，把少數範例湊成多道訓練題。"},{"term":"核心知識先驗（Core Knowledge）","plain":"先驗＝天生就帶、不用學的知識。ARC 只用四類：物件與物理、能動性（會動的有目標）、數與計數、幾何拓撲。"}],"highlights":[{"arxiv_id":"1911.01547","title_zh":"智力是技能習得效率","title_en":"On the Measure of Intelligence","year":"2019-11","role":"原典","one_liner":"Chollet 論證技能可以用先驗或資料買到，改用技能習得效率定義智力，並端出 ARC。","core":"智力≈泛化難度×技能÷（先驗＋經驗）：同樣的成績，靠越少天生知識與訓練資料拿到，分數越高。泛化難度指考題解法比訓練時看過的要改寫多少。ARC 只准用四類核心知識先驗（Core Knowledge），題目對出題者也是新的。","number":{"label":"ARC 題數","value":"400 訓練＋600 評估","note":"作者自報"},"why":"它定調 ARC 是程式合成題：理想解法是寫一套 DSL，從範例搜出能解題的程式。","links":{"arxiv":"https://arxiv.org/abs/1911.01547","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/1911.01547_Measure_of_Intelligence.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/1911.01547_Measure_of_Intelligence.zh-TW.md"},"plain":"等於有人先證明跑分能用資料買到，再出一份不能事先刷題的考卷，改考臨場學會的速度。"},{"arxiv_id":"2411.02272","title_zh":"歸納與轉導幾乎不重疊","title_en":"Combining Induction and Transduction for Abstract Reasoning","year":"2024-11","role":"範式主軸","one_liner":"同資料、同架構訓出的歸納模型與轉導模型，解的題幾乎不重疊，兩個併用拿 56.75%。","core":"歸納讓 Llama3.1-8B 寫 Python，拿範例當單元測試過濾候選；轉導用 beam search（每步只留分數最高的幾條）直接吐出網格。先跑歸納，沒有候選程式過關才退回轉導。","number":{"label":"ARC-1 公開驗證","value":"56.75%","note":"作者自報"},"why":"推翻「歸納較優」與「純轉導加 TTT」兩種主流立場，最高分只能是拼裝出來的。","links":{"arxiv":"https://arxiv.org/abs/2411.02272","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2411.02272_Induction_Transduction.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2411.02272_Induction_Transduction.zh-TW.md"},"plain":"等於一個寫程式解、一個憑手感直接畫答案。先信程式，程式生不出來再交給手感。"},{"arxiv_id":"2411.07279","title_zh":"每題臨時訓一組 LoRA","title_en":"The Surprising Effectiveness of Test-Time Training for Few-Shot Learning","year":"2024-11","role":"範式轉折","one_liner":"推論時拿該題範例臨時更新參數，ARC 公開驗證從 18.3% 一舉拉到 47.1%。","core":"用留一法（leave-one-out）把範例湊成訓練題：抽掉一對當考題、其餘當提示，再用翻轉、旋轉、換色多生幾份，訓一組只服務這題的低秩適配器（LoRA）。推論時換多個視角作答再投票。","number":{"label":"ARC 公開驗證","value":"18.3%→47.1%","note":"作者自報"},"why":"ARC 史上單招最大躍進。和程式合成合起來才 61.9%，拿掉合成器只剩 47.1%，取代不了它。","links":{"arxiv":"https://arxiv.org/abs/2411.07279","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2411.07279_Test_Time_Training.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2411.07279_Test_Time_Training.zh-TW.md"},"plain":"等於模型本體不動，遇到新題拿它自己的範例現場編一份小補丁掛上去，答完就丟。"},{"arxiv_id":"2605.01154","title_zh":"把 21.7% 打成 0% 的配方","title_en":"Multi-Perspective Transformers in ARC-AGI-2 Challenge","year":"2026-05","role":"誠實失敗報告","one_liner":"20M 小模型在 ARC-AGI-2 評測拿 21.7%，套上 TTT 與 PoE 後掉到 0%。","core":"小模型只有兩到四個範例，測試時訓練直接死背範例細節。專家乘積（PoE）把題目旋轉、翻轉、換色成幾十個視角各解一次，再合併各視角的信心挑答案；但模型只訓過逐行序列化，換視角它根本沒學過。","number":{"label":"訓練評測落差","value":"96.1% vs 21.7%","note":"作者自報"},"why":"測試時技術的收益綁死底層模型品質與防過擬合，照抄冠軍配方可能把分數打成零。","links":{"arxiv":"https://arxiv.org/abs/2605.01154","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2605.01154_MultiPerspective_ARC_AGI2.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2605.01154_MultiPerspective_ARC_AGI2.zh-TW.md"},"plain":"等於照抄冠軍的設定檔，卻沒發現自己的模型從沒訓過那些視角，一跑整組歸零。"}],"question":"測試時多花的算力，什麼時候是真適應、什麼時候只是死背範例？","all_papers":[{"arxiv_id":"1911.01547","status":"✅","title_zh":"論智力測量（On the Measure of Intelligence）","cat":"E","summary_file":"1911.01547_Measure_of_Intelligence.摘要.md","translate_file":"1911.01547_Measure_of_Intelligence.zh-TW.md"},{"arxiv_id":"2412.04604","status":"✅","title_zh":"2024 年 ARC 獎：技術報告","cat":"E","summary_file":"2412.04604_ARC_Prize_2024.摘要.md","translate_file":"2412.04604_ARC_Prize_2024.zh-TW.md"},{"arxiv_id":"2507.14172","status":"✅","title_zh":"用於演化程式合成的自我改進語言模型：ARC-AGI","cat":"E","summary_file":"2507.14172_SOAR.摘要.md","translate_file":"2507.14172_SOAR.zh-TW.md"},{"arxiv_id":"2505.07859","status":"✅","title_zh":"提升 ARC 效能是視角問題","cat":"E","summary_file":"2505.07859_Product_of_Experts_ARC.摘要.md","translate_file":"2505.07859_Product_of_Experts_ARC.zh-TW.md"},{"arxiv_id":"2411.17708","status":"✅","title_zh":"面向 ARC-AGI 的高效神經引導程式誘導","cat":"E","summary_file":"2411.17708_GridCoder_ARC_Program_Induction.摘要.md","translate_file":"2411.17708_GridCoder_ARC_Program_Induction.zh-TW.md"},{"arxiv_id":"2411.08706","status":"✅","title_zh":"搜尋潛在程式空間","cat":"E","summary_file":"2411.08706_LPN_Latent_Program_Search.摘要.md","translate_file":"2411.08706_LPN_Latent_Program_Search.zh-TW.md"},{"arxiv_id":"2411.02272","status":"✅","title_zh":"結合歸納和傳導進行抽象推理","cat":"E","summary_file":"2411.02272_Induction_Transduction.摘要.md","translate_file":"2411.02272_Induction_Transduction.zh-TW.md"},{"arxiv_id":"2411.0727 壓進權重，快但只認跟訓練資料同類的題。","增強層是外掛模組，像等式圖（e-graph）去重、降維、單位對齊，接哪個求解器都能用。","科學發現要的是還原出正確結構，不是誤差低；結構對了，外推到沒量過的範圍才準。","判定有沒有還原本身就難；回復率（recovery rate）新基準改接受多種等價公式。"],"open":"怎麼讓模型學會 sin、平方、加法這些能重組出新公式的數學零件，而不是背「這堆點就配這條式」。"},"glossary":[{"term":"符號迴歸（Symbolic Regression）","plain":"給一堆 (x, y) 資料點，反推出一條人看得懂的公式，形式跟係數一起找。"},{"term":"最小描述長度（MDL）","plain":"把「這條公式寫下來要幾個位元」當複雜度分數。愈短愈可能是真規律，不是硬湊出來剛好穿過這批點。"},{"term":"蒙地卡羅樹搜尋（MCTS）","plain":"把「一個符號一個符號寫出公式」當成走一棵樹，用隨機試跑的分數決定下一步往哪展開。"},{"term":"極值老虎機（extreme bandit）","plain":"老虎機問題是好幾台機器報酬未知，要邊試邊賺。UCB 追平均報酬最高那台，極值老虎機追出現過最高分的那台。"},{"term":"後悔值（regret）","plain":"你實際拿到的分數，跟事後看最佳選擇差多少。界愈緊代表愈快收斂到好答案。"},{"term":"等式圖（e-graph）","plain":"一種資料結構，把數學上等價的多種寫法共用子樹擠成一張圖，編譯器最佳化也用它。"},{"term":"回復率（recovery rate）","plain":"測試題裡有多少條被還原出跟真公式等價的式子。看的是結構對不對，不是誤差多小。"}],"highlights":[{"arxiv_id":"2512.15920","title_zh":"符號迴歸的總綱地圖","title_en":"Introduction to the Special Issue on Symbolic Regression in the Physical Sciences","year":"2025-12","role":"定位入口","one_liner":"皇家學會特刊導論，界定符號迴歸、盤點三大用途與方法學詞彙。","core":"人看得懂的公式若抓到真實結構，才能外推到沒量過的範圍。最小描述長度（MDL）懲罰長公式，免得搜尋用硬湊的式子只擬合這批點。領域知識也會砍候選；單位齊次像 type check，要求等式兩邊的物理單位一致。","number":{"label":"用途分類","value":"發現／建模／代理","note":"作者自報"},"why":"先有這張地圖，後面每一派才知道自己在解哪一段問題。","plain":"像專案的 README 先講清楚術語表跟模組邊界，後面幾篇才知道各自補哪一塊。","links":{"arxiv":"https://arxiv.org/abs/2512.15920","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2512.15920_SR_Physical_Sciences_Intro.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2512.15920_SR_Physical_Sciences_Intro.zh-TW.md"}},{"arxiv_id":"2509.15929","title_zh":"MCTS 符號迴歸的兩處改造","title_en":"Improving Monte Carlo Tree Search for Symbolic Regression","year":"2025-09","role":"搜尋式代表","one_liner":"UCB 換成極值老虎機（extreme bandit），MCTS 再用變異、交叉直接改公式。","core":"符號迴歸只求一條全域最優式，不求平均獎勵高，因此用專追最高分的極值老虎機取代 UCB。變異（隨機換掉公式樹一個子樹）、交叉（兩條式子互換子樹）是 MCTS 展開節點時新增的動作，直接改整條候選式，更快更穩。","number":{"label":"Nguyen 回復率","value":"93.25%","note":"作者自報"},"why":"搜尋式的價值：不被預訓練分布綁住，還能像這篇一樣附理論保證（極值老虎機在常見獎勵分布假設下最優）。","plain":"搜尋不只逐符號往下走。MCTS 展開節點時也能選變異或交叉，直接改整條候選式；目標則從平均分高改為找到一次最高分，回復率也提高。","links":{"arxiv":"https://arxiv.org/abs/2509.15929","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2509.15929_Improved_MCTS_SR.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2509.15929_Improved_MCTS_SR.zh-TW.md"}},{"arxiv_id":"2509.19849","title_zh":"預訓練符號迴歸的泛化體檢","title_en":"Analyzing Generalization in Pre-Trained Symbolic Regression","year":"2025-09","role":"誠實冷水","one_liner":"測 5 個預訓練 transformer（LLM 那類模型）：題目跟訓練資料同類就準，換一類就退化。","core":"三組題按是否落在預訓練資料的取樣範圍分：同範圍、其中一個子範圍、與它完全不相交。前兩組表現好，第三組一致退化；模型學的是資料點分布形狀對公式結構的配對，不是能重組的規則。標準化只改數值範圍，救不了。","number":{"label":"受測模型","value":"5 個預訓練模型","note":"作者自報"},"why":"把速度的代價講明白，資料一離開訓練時見過的那類，就該回頭用搜尋式。","plain":"像只背過題庫的考生：題目來自預訓練取樣範圍或其子集就答得好，換成完全不相交的一類便一致退化；標準化也救不了。","links":{"arxiv":"https://arxiv.org/abs/2509.19849","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2509.19849_Pretrained_SR_Generalization.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2509.19849_Pretrained_SR_Generalization.zh-TW.md"}},{"arxiv_id":"2511.05849","title_zh":"用等式圖把符號等價餵進搜尋","title_en":"EGG-SR: Embedding Symbolic Equivalence into Symbolic Regression via Equality Graph","year":"2025-11","role":"正交增強層","one_liner":"等式圖接進 MCTS、LLM 與逐符號吐公式的神經網路（策略網路），三者都受益。","core":"log(2x) 與 log2+logx 是同一函數，卻被分頭探索。等式圖套改寫規則直到生不出新形式，取出等價式。逐符號吐公式的神經網路把等價式的機率加總成同一答案的機率來更新；MCTS 則讓等價路徑共用分數。","number":{"label":"理論保證","value":"regret 界＋變異數","note":"作者自報"},"why":"把等價式合併後候選變少、統計可共享；作者證明後悔值（regret）界更緊，搜尋更快更穩。","plain":"像搜尋前先去重：等式圖把同一函數的不同寫法歸成一組，讓一次探索的分數與機率回饋同組候選；作者證明這樣搜得更快更穩。","links":{"arxiv":"https://arxiv.org/abs/2511.05849","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2511.05849_EGG_SR.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2511.05849_EGG_SR.zh-TW.md"}}],"question":"LLM 若背過 AI Feynman（100 條物理公式的標 year":"2025-07","role":"定位原典","one_liner":"把神經符號推理定義成邏輯函數乘信念函數再積分的統一形式。","core":"三件套。邏輯函數篩掉不合規的真假組合，信念函數替每組打分。測度是設計者選定的「權重怎麼加總」規則：有限個就相加，連續的就積分。有限組合時，整式退化成加權模型計數（WMC）。","number":{"label":"收編系統數","value":"30+ 個既有系統","note":"作者自報"},"why":"要比較兩個神經符號系統，從此只要問它的邏輯、信念、測度。","plain":"等於幫一整個領域寫出共用的介面定義，30 幾個既有系統都只是它的實作。","links":{"arxiv":"https://arxiv.org/abs/2507.11127","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2507.11127_Defining_Neurosymbolic_AI.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2507.11127_Defining_Neurosymbolic_AI.zh-TW.md"}},{"arxiv_id":"2412.07331","title_zh":"符號自動機：公式管轉移","title_en":"NeSyA: Neurosymbolic Automata","year":"2024-12","role":"緊耦合代表","one_liner":"符號自動機管時序、命題邏輯管轉移，接上神經感知端到端可微。","core":"它和普通狀態機不同，轉移條件不是單一字元，而是命題公式，如「有行人且燈是紅的」。神經網路估命題為真的機率；知識編譯（knowledge compilation）算公式機率，再用矩陣乘法更新狀態，梯度可傳回。","number":{"label":"速度比較","value":"快 2 個數量級","note":"作者自報"},"why":"給出機率語意勝過模糊邏輯的實證，序列越長差距越大，也示範時序知識怎麼注入感知。","plain":"等於把狀態機接在 CNN 後面，每條邊改用「有行人且燈是紅的」這類公式；公式機率控制狀態怎麼走。","links":{"arxiv":"https://arxiv.org/abs/2412.07331","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2412.07331_NeSyA.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2412.07331_NeSyA.zh-TW.md"}},{"arxiv_id":"2604.27960","title_zh":"讓 LLM 寫 ASP，求解器改作業","title_en":"LLMs as ASP Programmers: Self-Correction Enables Task-Agnostic Nonmonotonic Reasoning","year":"2026-04","role":"LLM＋求解器","one_liner":"LLM 把自然語言翻成 ASP，求解器的結構化錯誤驅動自我修正迴圈。","core":"答案集程式設計（ASP）可寫「鳥通常會飛，企鵝例外」。它的穩定模型（stable model）是一組彼此撐得住、又沒有多餘假設的自洽答案，求解器就是找這些答案。結構化錯誤再交給 LLM 修程式。","number":{"label":"自我修正增益","value":"54.6%→78.0%","note":"作者自報"},"why":"給 LLM 的 ASP 語法參考，精簡版長度只有完整版的 1/8，反而讓它寫得更準。","plain":"等於把 LLM 當成寫規則程式的工程師，求解器當編譯器，錯誤訊息丟回去讓它自己修，平均修兩次，而且不用逐個任務餵知識。","links":{"arxiv":"https://arxiv.org/abs/2604.27960","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2604.27960_LLM_ASP_Self_Correction.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2604.27960_LLM_ASP_Self_Correction.zh-TW.md"}},{"arxiv_id":"2510.14538","title_zh":"推理捷徑：標籤對、概念全錯","title_en":"Symbol Grounding in Neuro-Symbolic AI: A Gentle Introduction to Reasoning Shortcuts","year":"2025-10","role":"誠實問題","one_liner":"把行人和紅燈對調照樣會煞車，靠錯誤接地也能拿到高準確率。","core":"推理捷徑（reasoning shortcut）指「概念接錯卻仍答對」的對應方式。這種方式有幾種跟架構無關，只要多個概念導向同一標籤，數目就隨多對一的程度指數增加。不可能性結果：標籤錯誤率降到零，概念錯誤率仍可很高。","number":{"label":"緩解策略","value":"10 種，各有代價","note":"本檔補註"},"why":"神經符號承諾的可解釋與可重用，正是被錯誤接地悄悄吃掉的那塊。","plain":"等於單元測試全綠、內部語意卻接反了。測試選得不夠嚴的時候，全綠本身證明不了什麼。","links":{"arxiv":"https://arxiv.org/abs/2510.14538","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2510.14538_Reasoning_Shortcuts.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2510.14538_Reasoning_Shortcuts.zh-TW.md"}}],"question":"標籤準確率很漂亮，你怎麼知道概念沒有全錯？","all_papers":[{"arxiv_id":"2501.05435","status":"✅","title_zh":"2024 年的神經符號人工智慧：系統綜述","cat":"A","summary_file":"2501.05435_Neurosymbolic_AI_2024_Review.摘要.md","translate_file":"2501.05435_Neurosymbolic_AI_2024_Review.zh-TW.md"},{"arxiv_id":"2507.11127","status":"✅","title_zh":"定義神經符號人工智慧","cat":"A","summary_file":"2507.11127_Defining_Neurosymbolic_AI.摘要.md","translate_file":"2507.11127_Defining_Neurosymbolic_AI.zh-TW.md"},{"arxiv_id":"2507.08216","status":"✅","title_zh":"神經符號 AI 的接地（grounding）方法（IJCAI-25）","cat":"A","summary_file":"2507.08216_Grounding_Methods_NeSy.摘要.md","translate_file":"2507.08216_Grounding_Methods_NeSy.zh-TW.md"},{"arxiv_id":"2411.04383","status":"✅","title_zh":"神經符號人工智慧：可解釋性、挑戰和未來趨勢","cat":"A","summary_file":"2411.04383_NeSy_Explainability_Challenges.摘要.md","translate_file":"2411.04383_NeSy_Explainability_Challenges.zh-TW.md"},{"arxiv_id":"2401.01040","status":"✅","title_zh":"邁向認知人工智慧系統：神經符號 AI 綜述與展望","cat":"A","summary_file":"2401.01040_Cognitive_AI_NSAI_Survey.摘要.md","translate_file":"2401.01040_Cognitive_AI_NSAI_Surv oop.zh-TW.md"},{"arxiv_id":"2608.08786","status":"✅","title_zh":"SymDiag：將 CoT 雙重編譯為符號約束，逐步診斷 translation error 與 reasoning error","cat":"B","summary_file":"2608.08786_SymDiag.摘要.md","translate_file":"2608.08786_SymDiag.zh-TW.md"},{"arxiv_id":"2606.04381","status":"✅","title_zh":"Spatial Language Model：把幾何實體編成空間 token 插入語言模型","cat":"B","summary_file":"2606.04381_SymbolicToGeometric.摘要.md","translate_file":"2606.04381_SymbolicToGeometric.zh-TW.md"}]},{"id":"automata","name":"自動機、細胞自動機與圖靈機","minutes":7,"paper_count":27,"deep_doc":"https://github.com/justty32/paper_readings/blob/main/deep/automata_differentiable_computation.md","gist":{"summary":"這條線問神經網路能算什麼。前饋網路精確等於確定有限自動機（DFA），每層只算一步，字串多長就需多少層；深度固定，能處理的長度也固定。對角狀態空間模型（SSM）追不動非可解群 A₅（non-solvable group A₅），得換轉移矩陣。","points":["能力上限是正則語言（regular language）：固定幾個狀態就判斷得了的規則。","正確解對應某組權重，但從隨機初始化做梯度下降，不一定走得到那組權重。","主旋律是鬆弛與結晶（relax and crystallize）：訓練連續、推論離散。","抽得出離散自動機，不代表訓練好的網路內部真的照它運作。"],"open":"下推自動機（PDA）這一階還沒人給出構造法：給一台 PDA 就寫出網路權重。抽出的自動機是否等於原網路，也沒統一驗證法。"},"glossary":[{"term":"確定有限自動機（DFA）","plain":"只有固定幾個狀態的機器，讀進一個字元就照表跳到下一個狀態，沒有額外記憶體。"},{"term":"Chomsky 階層（Chomsky hierarchy）","plain":"語言的難度分級，由弱到強：正則語言、上下文無關、圖靈可計算。越高階需要的記憶越多。"},{"term":"下推自動機（PDA）","plain":"有限狀態機外掛一個堆疊，能配對括號、能數 aⁿbⁿ，比 DFA 剛好強一級。"},{"term":"狀態空間模型（SSM）","plain":"Mamba 這類序列模型，用一個狀態向量逐步更新。轉移矩陣夠簡單時可平行掃描，不必一步步跑。"},{"term":"非可解群 A₅（non-solvable group A₅）","plain":"五張牌所有重排動作的集合。任務是讀一串動作、答出最後排列；這些動作拆不成可各自累計的簡單層，對角矩陣追不上。"},{"term":"正則語言（regular language）","plain":"只靠固定幾個狀態、不用額外記憶就能判斷的規則，如以 a 開頭或長度為偶數；aⁿbⁿ 要計數，不算。"},{"term":"鬆弛與結晶（relax and crystallize）","plain":"訓練時把離散運算換成連續近似讓梯度過得去，訓練完把每格固定成唯一運算，變確定電路。"},{"term":"神經細胞自動機（NCA）","plain":"一張格子，每格存一個狀態向量，所有格子反覆套用同一條只看鄰居的更新規則。"}],"highlights":[{"arxiv_id":"2505.11694","title_zh":"前饋網路精確等價 DFA","title_en":"Neural Networks as Universal Finite-State Machines: A Constructive Deterministic Finite Automaton Theory","year":"2025-05","role":"理論定位原典","one_liner":"構造性證明前饋網路逐層模擬 DFA，並劃出固定深度算不動的邊界。","core":"每層只算 DFA 一步轉移，字串長 L 就展開成 L 層；深度固定，能處理的長度也固定。二進位狀態編碼把神經元數降為狀態數的對數。aⁿbⁿ 要無限計數，因此掛掉。","number":{"label":"aⁿbⁿ 外推準確率","value":"0.508，近乎隨機","note":"作者自報"},"why":"它把 Chomsky 階層（Chomsky hierarchy）變成能力邊界；外推就是測比訓練更長的字串。","plain":"等於證明了：把網路一層層疊起來，就是在跑一台狀態機。層數固定、狀態數也固定，沒地方存「已經看過幾個 a」，要記數量的題目一定掛。","links":{"arxiv":"https://arxiv.org/abs/2505.11694","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2505.11694_NN_as_Universal_FSM.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2505.11694_NN_as_Universal_FSM.zh-TW.md"}},{"arxiv_id":"2506.04912","title_zh":"細胞自動機結晶成邏輯電路","title_en":"Differentiable Logic Cellular Automata: From Game of Life to Pattern Generation","year":"2025-06","role":"範式代表作","one_liner":"神經細胞自動機（NCA）的更新規則改用可微邏輯閘，訓練完結晶成確定電路。","core":"每格存二值狀態。感知就是每格讀鄰居狀態，使用接線固定的鄰居讀取網路；更新也用邏輯閘，只學各閘運算。訓練時 AND 改為 a·b 傳梯度，推論時選定每閘運算並固定。","number":{"label":"生命遊戲用閘數","value":"336 個有效閘","note":"作者自報"},"why":"把「訓練連續、推論離散」示範到底。沒特別設計就有容錯：永久停用部分格子，圖樣仍維持。","plain":"等於用梯度下降去搜一張電路圖。訓練期是浮點數，訓練完直接印成 336 個閘的生命遊戲電路，可以燒進 FPGA。","links":{"arxiv":"https://arxiv.org/abs/2506.04912","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2506.04912_DiffLogic_CA.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2506.04912_DiffLogic_CA.zh-TW.md"}},{"arxiv_id":"2509.22284","title_zh":"單層 SSM 模擬任意有限自動機","title_en":"Structured Sparse Transition Matrices to Enable State Tracking in State-Space Models","year":"2025-09","role":"範式轉折","one_liner":"轉移矩陣改成稀疏置換乘上複數對角，單層 SSM 就能模擬任意有限自動機。","core":"A=P·D：P 是重排矩陣（每行每列各一個 1），D 是複數對角，每個輸入符號各有 P、D。兩個 P·D 相乘仍是 P·D 形式，算一次只要 O(N)，N 是狀態維度，所以能像前綴和分治平行，總量隨序列長 L 線性。","number":{"label":"非可解群 A₅","value":"單層 100%","note":"作者自報"},"why":"對角 SSM 追不動 A₅，問題不在遞迴不夠深，在轉移矩陣的代數結構挑錯了。","plain":"等於發現對角矩陣只會把各維各自縮放，追不上洗牌。改成「先洗牌、再縮放」，一層就追得動，速度幾乎沒掉。","links":{"arxiv":"https://arxiv.org/abs/2509.22284","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2509.22284_PD_SSM_State_Tracking.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2509.22284_PD_SSM_State_Tracking.zh-TW.md"}},{"arxiv_id":"2605.08150","title_zh":"把圖靈機編譯成網路權重","title_en":"A PyTorch Library of Turing-Complete Neural Networks","year":"2026-05","role":"誠實警告","one_liner":"給圖靈機規格，直接編出 PyTorch 權重，免訓練。附 Transformer 與堆疊機建構。","core":"五層編譯堆疊：ReLU 湊出邏輯閘；轉移表寫成 DNF（一串 AND 再 OR 起來）；閘拼成逐位進位的加法器；硬注意力只挑一個位置、不做加權平均，用來查紙帶位址；前饋層依優先規則選出符號。","number":{"label":"可靠 pop 次數","value":"float64 約 8 次","note":"作者自報"},"why":"手工網路可讀，不代表梯度訓練的也如此。若從訓練好的網路抽出自動機或電路，還要驗它是否真等於網路行為。","plain":"等於把圖靈機編譯成權重。SS95（1995 年的堆疊機建構）把整個堆疊存進一個數的小數位，每 pop 一次捨入誤差就放大幾十倍，float64 撐約 8 次。","links":{"arxiv":"https://arxiv.org/abs/2605.08150","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2605.08150_Turing_Complete_NN_Library.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2605.08150_Turing_Complete_NN_Library.zh-TW.md"}}],"question":"訓練完結晶成電路後，推論能否整個換成電路、丟掉神經網路？怎麼確認兩者對所有輸入等價？","all_papers":[{"arxiv_id":"2505.13058","status":"✅","title_zh":"通往通用神經細胞自動機的道路","cat":"F","summary_file":"2505.13058_Universal_NCA.摘要.md","translate_file":"2505.13058_Universal_NCA.zh-TW.md"},{"arxiv_id":"2506.22899","status":"✅","title_zh":"神經細胞自動機：從細胞到像素","cat":"F","summary_file":"2506.22899_Cells_to_Pixels.摘要.md","translate_file":"2506.22899_Cells_to_Pixels.zh-TW.md"},{"arxiv_id":"2506.17333","status":"✅","title_zh":"AutomataGPT：二維細胞自動機的預測與規則集推理","cat":"F","summary_file":"2506.17333_AutomataGPT.摘要.md","translate_file":"2506.17333_AutomataGPT.zh-TW.md"},{"arxiv_id":"2409.02740","status":"✅","title_zh":"用於自動細胞自動機分類的卷積神經網絡","cat":"F","summary_file":"2409.02740_CNN_CA_Classification.摘要.md","translate_file":"2409.02740_CNN_CA_Classification.zh-TW.md"},{"arxiv_id":"2505.11694","status":"✅","title_zh":"神經網路作為通用有限狀態機：構造性 DFA 理論","cat":"F","summary_file":"2505.11694_NN_as_Universal_FSM.摘要.md","translate_file":"2505.11694_NN_as_Universal_FSM.zh-TW.md"},{"arxiv_id":"2408.11042","sta
