.md","translate_file":"2608.01851_WeightsOrSkills.zh-TW.md"}]},{"id":"cost-cascade","name":"推理成本：路由、級聯、推測解碼","minutes":10,"paper_count":41,"deep_doc":"https://github.com/justty32/paper_readings/blob/main/deep/aicore_reliable_function_landscape/01_ai_core_的北極星，一句話重述.md","gist":{"summary":"省推理成本不是只換小模型，而是在不同尺度決定何時值得花貴算力：整題可先路由或逐級升級；生成途中可讓便宜草稿先猜、昂貴模型批次驗證；長期還可蒸餾或快取。方法已從啟發式擴到學習式與無損解碼，但收益仍取決於可靠門檻與工作負載。","points":["路由在回答前只選一個模型，延遲低；級聯看過便宜答案後才決定升級。","推測式解碼把同一原理下沉到詞元：便宜模型猜，目標模型批次驗證。","蒸餾與語意快取把成本梯度拉到生命週期：少呼叫，甚至不再呼叫大模型。","理論省本空間很大，實測卻常輸給靜態基線；閘門品質才是成敗核心。"],"open":"如何讓升級閘門比省下的推理更便宜，還能面對任務漂移保持校準？多種省錢技巧疊加時，又怎麼避免彼此抵銷？"},"glossary":[{"term":"路由（routing）","plain":"看見問題後、回答之前，就決定只交給哪一個模型。"},{"term":"級聯（cascade）","plain":"先用便宜模型作答；品質不過關，才沿著隊伍升級到更貴模型。"},{"term":"評分器（scorer）","plain":"替回答打可靠度分數的小元件；分數未過門檻就觸發升級。"},{"term":"推測式解碼（speculative decoding）","plain":"便宜模型先猜一串內容，昂貴模型一次檢查，合格的猜測直接採用。"},{"term":"詞元（token）","plain":"模型讀寫文字的基本小塊，可能是一個字、半個詞或標點。"},{"term":"無損（lossless）","plain":"加速後仍保持原目標模型的輸出分布，不拿品質換速度。"},{"term":"非遞減凸包（NDCH）","plain":"把成本與品質散點包成一條最佳邊界，方便公平比較不同路由器。"}],"highlights":[{"arxiv_id":"2305.05176","title_zh":"便宜先答，不行再升級","title_en":"FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance","year":"2023-05","role":"級聯入口","one_liner":"FrugalGPT 用小型評分器把模型排成級聯，匹配最佳模型時成本最高省 98.3%。","plain":"等於先請便宜助手回答，再找一位小評審把關；只有評審搖頭，才把題目送給昂貴專家。","core":"把模型排成由便宜到昂貴的隊伍，小型評分器判斷回答是否可靠；沒過門檻才升級。匹配最佳單一模型表現時，成本最高省 98.3%。","number":{"label":"匹配最佳模型省幅","value":"最高 98.3%","note":"作者自報"},"why":"它把省錢問題變成可調門檻的系統設計，也是理解路由與級聯差異的入口。","links":{"arxiv":"https://arxiv.org/abs/2305.05176","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2305.05176_FrugalGPT.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2305.05176_FrugalGPT.zh-TW.md"}},{"arxiv_id":"2406.18665","title_zh":"進門就選強弱模型","title_en":"Learning to Route LLMs with Preference Data","year":"2024-06","role":"路由代表","one_liner":"RouteLLM 用偏好資料預測強模型何時會贏，每題只呼叫一個模型。","plain":"等於櫃台看題目就直接分流：簡單件交便宜助手，難件直送專家，不先試答也不回頭。","core":"用人類偏好資料學「強模型會贏的機率」，再以門檻決定每題只呼叫一個強或弱模型；在 MT Bench 對話評測維持 95% 的 GPT-4 強模型基準品質時，成本節省 3.66×。","number":{"label":"對話評測省本","value":"3.66×","note":"作者自報"},"why":"它清楚呈現路由的優點與代價：少一次呼叫、低延遲，但押注事前預測且無法補救。","links":{"arxiv":"https://arxiv.org/abs/2406.18665","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2406.18665_RouteLLM.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2406.18665_RouteLLM.zh-TW.md"}},{"arxiv_id":"2211.17192","title_zh":"小模型猜，大模型驗","title_en":"Fast Inference from Transformers via Speculative Decoding","year":"2022-11","role":"解碼代表","one_liner":"便宜模型先猜一串詞元，目標模型並行驗證，輸出不變而實測加速 2X–3X。","plain":"等於助手先草擬後面幾個字，主筆一次整批核對；對的直接收下，第一個錯處才改寫。","core":"小模型先猜多個詞元，目標模型一次並行檢查；接受／拒絕規則讓輸出分布與單跑目標模型相同。在 T5-XXL 目標模型上實測加速 2X–3X。","number":{"label":"T5-XXL 模型加速","value":"2X–3X","note":"作者自報"},"why":"它把成本梯度縮到單次生成內，示範便宜猜測加可靠驗證可以真正做到無損。","links":{"arxiv":"https://arxiv.org/abs/2211.17192","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2211.17192_Speculative_Decoding.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2211.17192_Speculative_Decoding.zh-TW.md"}},{"arxiv_id":"2403.12031","title_zh":"路由器未必真省錢","title_en":"RouterBench: A Benchmark for Multi-LLM Routing System","year":"2024-03","role":"現實檢查","one_liner":"405,467 筆離線結果顯示，多數預測式路由未顯著贏過靜態基線。","plain":"等於先做一把公平的成本尺，才發現許多聰明分流器還打不贏隨機混用便宜與昂貴模型。","core":"用非遞減凸包與平均品質改善，統一比較美元成本與品質。多數預測式路由器未顯著勝過不看題目的靜態基線，距離每題都選對模型的理論上界仍很遠。","number":{"label":"離線推論結果","value":"405,467 筆","note":"作者自報"},"why":"它提醒你別只看漂亮省幅；要先贏過靜態基線，並把評分器誤差算進去。","links":{"arxiv":"https://arxiv.org/abs/2403.12031","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2403.12031_RouterBench.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2403.12031_RouterBench.zh-TW.md"}}],"question":"若路由判錯一次的代價很高，你會選事前分流、事後級聯，還是無損但更吃算力的驗證？","all_papers":[{"arxiv_id":"2406. 法結構的規則，常用來定義程式語言與資料格式。"},{"term":"詞彙遮罩（token mask）","plain":"把當下不合法的 token 暫時封住，模型只能從其餘候選中選。"},{"term":"語意熵（semantic entropy）","plain":"衡量多次生成落入多少種不同意思；越高代表規格越可能含糊。"},{"term":"規格對齊（specification alignment）","plain":"確認模型理解、約束器允許與需求真正要的三者指向同一件事。"},{"term":"分布扭曲（distribution distortion）","plain":"護欄刪掉模型原本偏好的選項，迫使它轉向不熟悉的低機率寫法。"}],"highlights":[{"arxiv_id":"2109.05093","title_zh":"逐步攔掉非法資料庫查詢","title_en":"PICARD: Parsing Incrementally for Constrained Auto-Regressive Decoding from Language Models","year":"2021-09","role":"原型入口","one_liner":"PICARD 在生成每一步用增量解析剔除非法 token，免重訓就大減無效資料庫查詢。","plain":"等於在模型筆尖旁放一位資料庫查詢校對員：每寫一小段就檢查，走不通的路當場封掉。","core":"它把語言模型每步最可能的候選交給增量解析；詞法、文法或資料庫欄位規則不過就不准選。摘要自報，無效輸出從 12% 降至 2%，但合法仍不保證語意正確。","number":{"label":"無效輸出","value":"12%→2%","note":"作者自報"},"why":"它把「模型管內容、解析器管合法」做成可插拔原型，是整條線最清楚的入口。","links":{"arxiv":"https://arxiv.org/abs/2109.05093","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2109.05093_PICARD.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2109.05093_PICARD.zh-TW.md"}},{"arxiv_id":"2403.01632","title_zh":"大文法也能即時把關","title_en":"SynCode: LLM Generation with Grammar Augmentation","year":"2024-03","role":"語法範式","one_liner":"SynCode 預算文法遮罩，讓模型生成 Python、Go 等程式時幾乎不再犯語法錯。","plain":"等於先把整本文法編成快速查表；模型每敲一個字，只看此刻仍合法的按鍵。","core":"SynCode 先把上下文無關文法與 tokenizer 對齊，離線做詞彙遮罩，推理時查表。摘要自報，在 Python／Go 測試裡，語法錯誤平均削減 96.07%；它仍不檢查變數是否真的有定義。","number":{"label":"語法錯誤削減","value":"96.07%","note":"作者自報"},"why":"它把玩具格式的護欄擴到完整程式語言，並明示語法保證的能力邊界。","links":{"arxiv":"https://arxiv.org/abs/2403.01632","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2403.01632_SynCode.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2403.01632_SynCode.zh-TW.md"}},{"arxiv_id":"2505.07270","title_zh":"先修需求再寫程式","title_en":"SpecFix: Automated Repair of Ambiguous Problem Descriptions for Code Generation","year":"2025-05","role":"規格範式","one_liner":"SpecFix 比較候選程式的行為，反推出題意歧義，再自動做最小文字修補。","plain":"等於先看多位工程師把需求理解成哪些版本，再把文件改到只剩預期的那種解讀。","core":"它先以程式執行行為分群，用語意熵找出多種解讀，再以對比規格推斷做最小文字修補。摘要自報，被修改題目的 Pass@1（首次生成通過率）提升 30.9%，焦點從護欄轉到修好護欄所依據的需求。","number":{"label":"Pass@1 通過率","value":"+30.9%","note":"作者自報"},"why":"它把可靠性問題往上游推：若需求本身含糊，再強的解碼護欄也只會精準做錯事。","links":{"arxiv":"https://arxiv.org/abs/2505.07270","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2505.07270_SpecFix.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2505.07270_SpecFix.zh-TW.md"}},{"arxiv_id":"2606.21619","title_zh":"護欄不完整反而更差","title_en":"The Alignment Problem in Constrained Code Generation","year":"2026-06","role":"誠實冷水","one_liner":"這篇證明護欄若漏掉合法寫法，功能正確率可能比完全不約束還差。","plain":"等於導航誤封正確道路：車確實沒違規，卻被逼進陌生小路，最後超時或抵達錯地方。","core":"作者把模型想寫的、目標規格允許的、約束器放行的三個集合分開量。摘要自報，約束器缺少合法寫法時，功能正確率最多下降 97%；分布扭曲會把模型逼進低機率死路。","number":{"label":"功能正確率","value":"最多 −97%","note":"作者自報"},"why":"它拆穿「加護欄必然更可靠」：必須先驗證約束器與真實規格是否對齊。","links":{"arxiv":"https://arxiv.org/abs/2606.21619","summary":"https://github.com/justty32/paper_readings/blob/main/summarize/2606.21619_Alignment_Constrained_CodeGen.摘要.md","translate":"https://github.com/justty32/paper_readings/blob/main/translate/2606.21619_Alignment_Constrained_CodeGen.zh-TW.md"}}],"question":"若護欄保證格式正確卻降低答對率，你會先修護欄、模型，還是需求？","all_papers":[{"arxiv_id":"2604.16198","status":"✅","title_zh":"REA-Coder：以需求檢查清單迭代對齊橋接 LLM 意圖缺口","cat":"I","summary_file":"2604.16198_REACoder.摘要.md","translate_file":"2604.16198_REACoder.zh-TW.md"},{"arxiv_id":"2307.09702","status":"✅","title_zh":"Outlines：以 FSM 引導解碼做高效受約束生成（正則→FSM 索引，每步 O(1) 遮罩；接 ai_core §5 受約束填碼、呼應 F 類 FSM 理論）","cat":"I","summary_file":"2307.09702_Outlines_Guided_Generation.摘要.md","translate_file":"2307.09702_Outlines_Guided_Generation.zh-TW.md"},{"arxiv_id":"2303.12570","status":"✅","title_zh":"RepoCoder：迭代式檢索-生成做倉庫級補全（接 ai_core §5 上層抽片段/下層接地填碼）","cat":"I","summary_file":"2303.12570_RepoCoder.摘要.md","translate_file":"2303.12570_RepoCoder.zh-TW.md"},{"arxiv_id":"21 ":"技能價值會隨任務與環境改變，路由門檻也會碰上工作負載漂移。若需求本身含糊，硬護欄只會精準執行錯誤規格。系統因此要保留成效紀錄，持續重估、修訂與退役。","lane_ids":["skill-library","cost-cascade","constrained-decoding"],"paper_ids":["2607.10113","2406.18665","2505.07270"]}],"outro":"三條線疊起來，方向是把智能體改造成可治理的系統：可重用技能與推理算力都經過可靠閘門，輸出再接受規格檢查。下一步要替每一道閘門留下判斷結果與代價，定期重估它該保留、調整或撤下。"}
