<a class="main-site-link" href="https://justty32.github.io/engineer_study/" aria-label="回到工程學習中央入口">← 回到工程學習主站</a><header class="site-header"><p class="eyebrow">03 / 網路與通訊路徑</p><h1>通訊路徑可被觀察、延遲、重放或改寫</h1><p class="lede">網路本身負責傳遞，不保證名稱、端點、內容或時間的新鮮度。安全協定必須明確補上這些性質。</p></header><nav class="top-nav" aria-label="課程導覽"><div class="top-nav-inner"><a href="index.html">地圖</a><a href="01-身分與工作階段.html">01 身分</a><a href="02-輸入解譯器與記憶體.html">02 輸入與記憶體</a><a aria-current="page" href="03-網路與通訊路徑.html">03 網路路徑</a><a href="04-權限可用性與供應鏈.html">04 權限與供應鏈</a><a href="../互動課程/名詞與概念字典.html">共同字典</a></div></nav><main class="page-shell"><p class="assumes"><strong>先修：</strong><a href="../互動課程/01-網路最小前置.html">位址、連接埠、封包、路由與傳輸狀態</a>及<a href="../互動課程/03-密碼學最小前置.html">傳輸層安全性協定</a>。</p>
<section class="workspace"><div class="controls"><h2>切換通訊攻擊情境</h2><div class="control"><label for="attack-scenario">手法</label><select id="attack-scenario"><option data-pre="攻擊者可由公開或內部位置觀察可達端點" data-mechanism="以連線回應、錯誤與時序推斷服務、版本或信任關係" data-change="攻擊者的系統模型更精確，但目標未必已被修改" data-impact="縮小後續嘗試範圍，增加針對性" data-control="減少暴露、統一錯誤、分段、速率限制與資產清冊" data-evidence="連線嘗試分布、目的連接埠、失敗率、來源與掃描節奏" data-limit="連接埠探測可能是健康檢查或研究，意圖需額外證據">偵察與服務探測</option><option data-pre="本地網路或名稱解析路徑允許未驗證的對應資訊" data-mechanism="偽造名稱或鄰居位址對應，使流量送往錯誤端點" data-change="後續連線路徑或目的端點改變" data-impact="竊聽、改寫、阻斷或引導至冒牌服務" data-control="端點憑證驗證、安全名稱解析、網路防護與靜態信任邊界" data-evidence="對應紀錄突變、憑證名稱不符、閘道變更、重複位址與封包路徑" data-limit="快取更新與網路切換也會造成合法變化">名稱與鄰居欺騙</option><option data-pre="攻擊者位於可觀察或可改寫通訊的路徑" data-mechanism="在兩端之間代理流量；若端點身分未驗證，雙方都可能連到攻擊者" data-change="通道端點或內容完整性不再符合預期" data-impact="機密外洩、交易改寫、憑證竊取或阻斷" data-control="正確驗證憑證與名稱、已驗證加密、嚴格失敗、通道綁定" data-evidence="握手參數、憑證鏈、端點名稱、路徑、延遲與內容驗證失敗" data-limit="代理與負載平衡器可能是授權架構，要對照信任設計">中間人攻擊</option><option data-pre="攻擊者能擷取先前有效訊息，協定缺少新鮮度或唯一性" data-mechanism="重新送出舊訊息，使接收端誤認為新動作" data-change="交易、命令或驗證被重複接受" data-impact="重複付款、重複控制、冒用或狀態回滾" data-control="隨機挑戰、序號、時間窗、唯一交易識別碼與去重" data-evidence="相同訊息鑑別值、序號倒退、重複交易識別碼與異常時間差" data-limit="合法重試也會重複傳送，應用需設計冪等性">重放攻擊</option><option data-pre="雙方為相容舊系統仍支援較弱版本或功能" data-mechanism="攻擊者干擾協商，誘使端點選擇較弱保護" data-change="通道安全性質低於雙方原本可用能力" data-impact="增加解密、竄改或身分冒用可能性" data-control="最低版本、降級保護、移除舊套件與嚴格協商驗證" data-evidence="協商版本、加密套件、失敗重試與設定變更" data-limit="低版本可能是合法舊客戶端，仍應依政策拒絕而非猜意圖">協定降級</option></select></div></div><div class="output"><div id="attack-detail" class="result-box" aria-live="polite"><h2 data-title></h2><div class="result-grid"><div><strong>前置</strong><span data-field="pre"></span></div><div><strong>機制</strong><span data-field="mechanism"></span></div><div><strong>狀態改變</strong><span data-field="change"></span></div><div><strong>影響</strong><span data-field="impact"></span></div><div><strong>控制</strong><span data-field="control"></span></div><div><strong>證據</strong><span data-field="evidence"></span></div><div><strong>推論限制</strong><span data-field="limit"></span></div></div></div></div></section>
<p class="note">看到加密流量仍能觀察端點、時間、大小與方向；看到明文流量也不代表其中一定含秘密。證據結論必須對應資產與協定語意。</p><div class="pager"><a href="02-輸入解譯器與記憶體.html">← 上一章</a><a href="04-權限可用性與供應鏈.html">下一章 →</a></div></main><footer class="site-footer"><span>03 網路與通訊路徑</span><a href="../../網路協定/互動課程/index.html">網路協定細講課程</a></footer></body></html>
