<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="機器人視覺零基礎互動課程"><title>01 投影｜機器人視覺</title><link rel="stylesheet" href="styles.css"></head><body><nav class="topbar"><a href="index.html">首頁</a><a href="00-光像素與座標系.html">零基礎</a><a href="03-特徵匹配與姿態估測.html">姿態估測</a><a href="06-C++感知管線與證據.html">C++／證據</a><a href="名詞與概念字典.html">字典</a></nav><main><p class="eyebrow">01 · PINHOLE PROJECTION</p><h1>針孔相機投影與畸變</h1><p class="lead">理想針孔模型用相似三角形把相機座標 (X,Y,Z) 投影到像素；Z 出現在分母，所以單張影像會失去絕對尺度。</p><div class="prereq"><strong>前置：</strong><a href="00-光像素與座標系.html">像素與相機座標</a>。</div><p>內參矩陣（intrinsic matrix）包含像素焦距 f<sub>x</sub>、f<sub>y</sub> 與主點 c<sub>x</sub>、c<sub>y</sub>。外參（extrinsics）是世界到相機的旋轉和平移。</p><section class="workspace"><h2>自由實驗：三維點投影</h2><div class="controls"><label>X（m）<input id="proj-x" type="range" min="-1" max="1" step="0.02" value="0.2"></label><label>Y（m）<input id="proj-y" type="range" min="-0.8" max="0.8" step="0.02" value="0.1"></label><label>Z（m）<input id="proj-z" type="range" min="0.1" max="4" step="0.05" value="1.2"></label><label>f（px）<input id="proj-fx" type="range" min="200" max="1200" step="10" value="600"></label></div><div id="proj-output" class="output" aria-live="polite"></div></section><h2>畸變不是外參錯誤</h2><p>徑向畸變使直線在邊緣彎曲；切向畸變常表示鏡片與感測器未完全同軸。畸變模型修正光學映射，不負責描述相機在世界中的姿態。</p><div class="pager"><a href="00-光像素與座標系.html">← 上一頁</a><a href="02-相機標定與手眼標定.html">下一頁 →</a></div></main><script src="app.js"></script></body></html>
