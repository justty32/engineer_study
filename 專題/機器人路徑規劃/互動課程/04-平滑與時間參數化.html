<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="機器人路徑與運動規劃零基礎互動課程"><title>04 軌跡｜機器人路徑與運動規劃</title><link rel="stylesheet" href="styles.css"></head><body><nav class="topbar"><a href="index.html">首頁</a><a href="00-從移動問題到規劃問題.html">零基礎</a><a href="03-PRM-RRT與RRT-star.html">取樣規劃</a><a href="06-C++架構與驗證證據.html">C++／證據</a><a href="名詞與概念字典.html">字典</a></nav><main><p class="eyebrow">04 · TRAJECTORY GENERATION</p><h1>平滑與時間參數化</h1><p class="lead">幾何規劃器產生的折線通常不能直接送控制器。先平滑或捷徑化，再沿路徑配置時間，使速度、加速度與必要的 jerk 限制成立。</p><div class="prereq"><strong>前置：</strong><a href="03-PRM-RRT與RRT-star.html">候選幾何路徑</a>。</div><h2>三層不可合併</h2><div class="flow"><span>幾何路徑 q(s)</span><span>時間律 s(t)</span><span>軌跡 q(t)</span><span>控制器追蹤</span></div><section class="workspace"><h2>自由實驗：單關節時間下界</h2><div class="controls"><label>角度變化 |Δq|（rad）<input id="time-dq" type="range" min="0.05" max="3" step="0.05" value="1.2"></label><label>最大速度（rad/s）<input id="time-v" type="range" min="0.1" max="3" step="0.1" value="1"></label><label>最大加速度（rad/s²）<input id="time-a" type="range" min="0.1" max="5" step="0.1" value="2"></label></div><div id="time-output" class="output" aria-live="polite"></div></section><p>jerk 是加速度對時間的變化率。只滿足速度與加速度仍可能讓命令在切換點不平順；真實驅動器還受力矩、負載、熱與振動限制。</p><div class="pager"><a href="03-PRM-RRT與RRT-star.html">← 上一頁</a><a href="05-七軸冗餘與線上重規劃.html">下一頁 →</a></div></main><script src="app.js"></script></body></html>
