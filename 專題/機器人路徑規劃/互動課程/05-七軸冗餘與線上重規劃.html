<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="機器人路徑與運動規劃零基礎互動課程"><title>05 七軸整合｜機器人路徑與運動規劃</title><link rel="stylesheet" href="styles.css"></head><body><nav class="topbar"><a href="index.html">首頁</a><a href="00-從移動問題到規劃問題.html">零基礎</a><a href="03-PRM-RRT與RRT-star.html">取樣規劃</a><a href="06-C++架構與驗證證據.html">C++／證據</a><a href="名詞與概念字典.html">字典</a></nav><main><p class="eyebrow">05 · REDUNDANCY AND REPLANNING</p><h1>七軸冗餘與線上重規劃</h1><p class="lead">同一工具位姿可能對應多個關節組態。若規劃器只在笛卡兒空間連接目標，就可能忽略肘部姿態、IK 分支跳變、自碰撞與關節極限。</p><div class="prereq"><strong>前置：</strong><a href="04-平滑與時間參數化.html">幾何路徑與軌跡</a>，以及<a href="../../機器人運動學/互動課程/07-冗餘零空間與肘部姿態.html">零空間</a>。</div><div class="grid"><article class="card"><h3>冗餘作為規劃變數</h3><p>把完整 q 放進搜尋可自然表達肘姿；代價是維度較高。另一做法是先規劃工具路徑再解析冗餘，但需防止 IK 分支不連續。</p></article><article class="card"><h3>線上重規劃</h3><p>感知更新障礙後，先驗證剩餘軌跡；失效時煞停、局部修補或全域重規劃。反應時間本身也是安全距離的一部分。</p></article></div><section class="workspace"><h2>自由實驗：交付閘門</h2><div class="controls"><label>連續碰撞檢查<select id="pipe-collision"><option value="yes">已啟用</option><option value="no">只有端點</option></select></label><label>動態限制<select id="pipe-limits"><option value="yes">已套用</option><option value="no">尚未套用</option></select></label><label>環境會改變<select id="pipe-dynamic"><option value="no">否</option><option value="yes">是</option></select></label></div><div id="pipe-output" class="output" aria-live="polite"></div></section><div class="pager"><a href="04-平滑與時間參數化.html">← 上一頁</a><a href="06-C++架構與驗證證據.html">下一頁 →</a></div></main><script src="app.js"></script></body></html>
